<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <div class="grid grid-cols-2">
        <div class="form-item">
            <label class="form-label">
                URL
                <strong class="text-primary">*</strong>
            </label>
            <div class="form-control-area">
                <input class="form-control" name="url" type="text" maxlength="1024" required placeholder="http://127.0.0.1:8080/api" th:value="${connector?.config?.url}?:'http://127.0.0.1:8080/api'"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Open Encryption<i class="fa fa-question-circle" title="When enabled, the request parameter is automatically encrypted when calling api, and the [open api] function needs to be enabled"></i></label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="enableEncrypt" th:checked="${connector?.config?.enableEncrypt}" type="checkbox" />
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 mt-4">
        <div class="form-item">
            <label class="form-label">Connection parameters<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <textarea name="properties" class="form-control" maxlength="1024" rows="6" required placeholder="One argument per row: key=value">
[[${connector?.config?.propertiesText ?:
'connection.timeout.ms=30000
socket.timeout.ms=30000
connection.request.timeout.ms=30000
retry.times=0
charset=UTF-8'}]]</textarea>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Is it a public network?<i class="fa fa-question-circle" title="Enabled with RSA-SHA256 for signature, default HMAC-SHA256"></i></label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="publicNetwork" th:checked="${connector?.config?.publicNetwork}" type="checkbox" />
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
    </div>

    <div class="blank-block"></div>

</div>
