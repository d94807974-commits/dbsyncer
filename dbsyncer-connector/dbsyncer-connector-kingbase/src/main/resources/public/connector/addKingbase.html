<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="grid grid-cols-2">
        <div class="form-item">
            <label class="form-label">Host<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="host" type="text" maxlength="100" required placeholder="127.0.0.1"
                       th:value="${connector?.config?.host}?: '127.0.0.1'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Port<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="port" type="number" maxlength="64" required placeholder="54321"
                       th:value="${connector?.config?.port}?: '54321'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Username<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" required maxlength="32" name="username" placeholder="system"
                       th:value="${connector?.config?.username}" type="text"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Password<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" required maxlength="64" name="password" placeholder="Please enter password"
                       type="password" th:value="${connector?.config?.password}"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Database name<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" required maxlength="64" name="database" placeholder="Please enter database name"
                       type="text" th:value="${connector?.config?.database}?: 'TEST'"/>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 mt-5">
        <div class="form-item">
            <label class="form-label">Delete slot<i aria-hidden="true" class="fa fa-question-circle"
                                                 title="Incremental sync: automatically delete Slot when stopping the driver"></i></label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="dropSlotOnClose"
                           th:checked="${#maps.isEmpty(connector?.config?.extInfo) or connector?.config?.extInfo?.dropSlotOnClose eq 'true'}"
                           type="checkbox"/>
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Plugin</label>
            <select class="form-control" id="pluginName" name="pluginName">
                <option value="test_decoding"
                        th:selected="${#maps.isEmpty(connector?.config?.extInfo) or connector?.config?.extInfo?.pluginName eq 'test_decoding'}">
                    test_decoding
                </option>
            </select>
        </div>

        <div class="form-item">
            <label class="form-label">Max connections<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="maxActive" type="number" required min="1" max="512"
                       th:value="${connector?.config?.maxActive}?:64" placeholder="Default 64"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">TTL (ms)<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="keepAlive" type="number" required min="10000" max="120000"
                       th:value="${connector?.config?.keepAlive}?:60000" placeholder="Default 60000"/>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Connection parameters</label>
            <div class="form-control-area">
                <textarea name="properties" class="form-control" maxlength="1024" rows="5"
                          th:text="${connector?.config?.propertiesText} ?: 'ssl=false&amp;stringtype=unspecified&amp;binaryTransfer=true&amp;loginTimeout=10&amp;connectTimeout=30'"></textarea>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Driver</label>
            <div class="form-control-area">
                <input class="form-control" name="driverClassName" readonly="true"
                       th:value="${connector?.config?.driverClassName} ?: 'com.kingbase8.Driver'" type="text"/>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            initSelect($('#pluginName'));
        });
    </script>
</div>

</html>
