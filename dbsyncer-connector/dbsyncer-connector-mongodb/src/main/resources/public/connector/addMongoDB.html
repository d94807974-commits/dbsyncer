<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="grid grid-cols-2">
        <div class="form-item">
            <label class="form-label">Host<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="host" type="text" maxlength="100" required placeholder="127.0.0.1"
                       th:value="${connector?.config?.host}?: '127.0.0.1'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Port<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="port" type="number" maxlength="64" required placeholder="27017"
                       th:value="${connector?.config?.port}?: '27017'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Username</label>
            <div class="form-control-area">
                <input class="form-control" maxlength="64" name="username" placeholder="Please enter username"
                       th:value="${connector?.config?.username}" type="text"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Password</label>
            <div class="form-control-area">
                <input class="form-control" maxlength="64" name="password" placeholder="Please enter password"
                       type="password" th:value="${connector?.config?.password}"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Database name<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" required maxlength="64" name="database" placeholder="Please enter database name"
                       type="text" th:value="${connector?.config?.database}?: 'test'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Authentication Library</label>
            <div class="form-control-area">
                <input class="form-control" maxlength="64" name="authDatabase" placeholder="admin"
                       type="text" th:value="${connector?.config?.authDatabase}?: 'admin'"/>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 mt-5">
        <div class="form-item">
            <label class="form-label">Max connections<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="maxPoolSize" type="number" required min="1" max="512"
                       th:value="${connector?.config?.maxPoolSize}?:64" placeholder="Default 64"/>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Connection parameters</label>
            <div class="form-control-area">
                <textarea name="properties" class="form-control" maxlength="1024" rows="5"
                          th:text="${connector?.config?.propertiesText} ?: 'retryWrites=true&amp;w=majority'"></textarea>
            </div>
        </div>
    </div>
    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Description</label>
            <div class="form-control-area text-xs text-muted">
                The official log increment (Change Stream) requires a MongoDB copy set or fractional cluster; a single machine deployment does not support real time grabbed.
            </div>
        </div>
    </div>
</div>

</html>
