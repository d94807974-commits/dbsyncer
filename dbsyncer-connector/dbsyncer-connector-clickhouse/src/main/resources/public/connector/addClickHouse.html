<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="grid grid-cols-2">
        <div class="form-item">
            <label class="form-label">Host<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="host" type="text" maxlength="100" required placeholder="127.0.0.1"
                       th:value="${connector?.config?.host}?: '127.0.0.1'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Port<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="port" type="number" maxlength="64" required placeholder="8123"
                       th:value="${connector?.config?.port}?: '8123'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Username<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" required maxlength="64" name="username" placeholder="default"
                       th:value="${connector?.config?.username}?: 'default'" type="text"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Password</label>
            <div class="form-control-area">
                <input class="form-control" maxlength="64" name="password" placeholder="Leave blank if none"
                       type="password" th:value="${connector?.config?.password}"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Database name<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" required maxlength="64" name="database" placeholder="default"
                       type="text" th:value="${connector?.config?.database}?: 'default'"/>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 mt-5">
        <div class="form-item">
            <label class="form-label">Incremental poll interval (seconds)
                <i class="fa fa-question-circle" title="In log-incremental mode, interval for polling new data by primary-key cursor"></i>
            </label>
            <div class="form-control-area">
                <input class="form-control" name="pollIntervalSeconds" type="number" min="1" max="3600"
                       th:value="${connector?.config?.extInfo?.getProperty('pollIntervalSeconds')}?:5" placeholder="Default 5"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Batch size
                <i class="fa fa-question-circle" title="Max rows fetched per poll in log-incremental mode"></i>
            </label>
            <div class="form-control-area">
                <input class="form-control" name="pollBatchSize" type="number" min="1" max="10000"
                       th:value="${connector?.config?.extInfo?.getProperty('pollBatchSize')}?:500" placeholder="Default 500"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Max connections<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="maxActive" type="number" required min="1" max="512"
                       th:value="${connector?.config?.maxActive}?:64" placeholder="Default 64"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Keep-alive (ms)<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="keepAlive" type="number" required min="10000" max="120000"
                       th:value="${connector?.config?.keepAlive}?:60000" placeholder="Default 60000"/>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Connection parameters</label>
            <div class="form-control-area">
                <textarea name="properties" class="form-control" maxlength="1024" rows="5"
                          th:text="${connector?.config?.propertiesText} ?: 'socket_timeout=300000&amp;connect_timeout=30000&amp;compress=0'"></textarea>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Driver</label>
            <div class="form-control-area">
                <input class="form-control" name="driverClassName" readonly="true"
                       th:value="${connector?.config?.driverClassName} ?: 'com.clickhouse.jdbc.ClickHouseDriver'" type="text"/>
            </div>
        </div>
    </div>
</div>

</html>
