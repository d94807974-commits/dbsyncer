<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <div class="grid grid-cols-2">
        <div class="form-item">
            <label class="form-label">Database file<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="serviceName" type="text" maxlength="512" required
                       placeholder="/data/demo.duckdb"
                       th:value="${connector?.config?.serviceName} ?: '/data/demo.duckdb'"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Max connections<strong class="text-primary">*</strong>
                <i class="fa fa-question-circle" title="DuckDB single-written multiple reading with no more than 8 recommendations"></i>
            </label>
            <div class="form-control-area">
                <input class="form-control" name="maxActive" type="number" required min="1" max="64"
                       th:value="${connector?.config?.maxActive}?:4" placeholder="Default 4"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">TTL (ms)<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="keepAlive" type="number" required min="10000" max="120000"
                       th:value="${connector?.config?.keepAlive}?:30000" placeholder="Default 30000"/>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Connection parameters</label>
            <div class="form-control-area">
                <textarea name="properties" class="form-control" maxlength="1024" rows="5"
                          placeholder="Optional JDBC additional parameters by key=value&amp; key2=value2"
                          th:text="${connector?.config?.propertiesText} ?: ''"></textarea>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Driver</label>
            <div class="form-control-area">
                <input class="form-control" readonly="true" name="driverClassName" type="text"
                       th:value="${connector?.config?.driverClassName} ?: 'org.duckdb.DuckDBDriver'"/>
            </div>
        </div>
    </div>
</div>

</html>
