<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <div class="grid grid-cols-2">
        <div class="form-item">
            <label class="form-label">Host<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="host" type="text" maxlength="100" required placeholder="127.0.0.1" th:value="${connector?.config?.host}?: '127.0.0.1'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Port<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="port" type="number" maxlength="64" required placeholder="2881" th:value="${connector?.config?.port}?: '2881'"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Username<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="username" type="text" maxlength="64" required placeholder="root@tenant" th:value="${connector?.config?.username}"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Password<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="password" type="password" maxlength="64" required placeholder="Please enter password" th:value="${connector?.config?.password}"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Binlog Host
                <i class="fa fa-question-circle" title="OpenBase Binlog service address, leave empty and use the top host"></i>
            </label>
            <div class="form-control-area">
                <input class="form-control" name="binlogHost" type="text" maxlength="100" placeholder="127.0.0.1"
                       th:value="${connector?.config?.extInfo?.getProperty('binlogHost')}"/>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Binlog Port
                <i class="fa fa-question-circle" title="Binlog Port (My Allow Protocol), leave empty and use the above SQL port"></i>
            </label>
            <div class="form-control-area">
                <input class="form-control" name="binlogPort" type="number" min="1" max="65535" placeholder="Binlog Information Port"
                       th:value="${connector?.config?.extInfo?.getProperty('binlogPort')}"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Max connections<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="maxActive" type="number" required min="1" max="512"
                       th:value="${connector?.config?.maxActive}?:64" placeholder="Default 64"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">TTL (ms)<strong class="text-primary">*</strong></label>
            <div class="form-control-area">
                <input class="form-control" name="keepAlive" type="number" required min="10000" max="120000"
                       th:value="${connector?.config?.keepAlive}?:60000" placeholder="Default 60000"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label">Driver</label>
            <div class="form-control-area">
                <input class="form-control" readonly="readonly" name="driverClassName" type="text"
                       th:value="${connector?.config?.driverClassName} ?: 'com.oceanbase.jdbc.Driver'"/>
            </div>
        </div>
    </div>

    <div class="grid mt-5">
        <div class="form-item">
            <label class="form-label">Connection parameters</label>
            <div class="form-control-area">
                <textarea name="properties" class="form-control" maxlength="1024" rows="5"
                          th:text="${connector?.config?.propertiesText} ?: 'rewriteBatchedStatements=true&amp;useUnicode=true&amp;characterEncoding=UTF8&amp;serverTimezone=Asia/Shanghai&amp;useSSL=false&amp;verifyServerCertificate=false&amp;autoReconnect=true&amp;failOverReadOnly=false&amp;tinyInt1isBit=false&amp;allowPublicKeyRetrieval=true&amp;cachePrepStmts=false'"></textarea>
            </div>
        </div>
    </div>

</div>

</html>
