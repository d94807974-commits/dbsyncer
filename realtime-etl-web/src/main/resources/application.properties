# Service IP (when realtime-etl.cluster.enabled=true, set a fixed IP so cluster nodes can reach each other)
server.ip=127.0.0.1
# Listen port
server.port=18686
# Session timeout (seconds)
server.servlet.session.timeout=1800
# Context path; '/' -> http://${server.ip}:${server.port}/
server.servlet.context-path=/
# Enable SSL (false=off; true=on)
server.ssl.enabled=false
# External keystore file
server.ssl.key-store=conf/realtime-etl.p12
server.ssl.key-store-password=realtime-etl
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=realtime-etl
# Enable plain HTTP port (false=off; true=on)
server.http.enabled=false
# Effective when both server.ssl.enabled and server.http.enabled are true
server.http.port=8080
# Force HTTP redirect to HTTPS (false=off; true=on)
server.http.redirect=false
# Active Spring profile
spring.profiles.active=default
#All < Trace < Debug < Info < Warn < Error < Fatal < OFF
logging.level.root=info

#web
# Scheduled task thread pool size
realtime-etl.web.scheduler.pool-size=8
# Reset admin password to default (false=disabled; true=reset — dangerous; set back to false after recovery)
realtime-etl.web.security.reset-pwd=false

#common
# Scheduler core threads
realtime-etl.common.dispatch.thread-core-size=8
# Scheduler max threads
realtime-etl.common.dispatch.max-thread-size=16
# Scheduler queue capacity
realtime-etl.common.dispatch.thread-queue-capacity=64

#parser
# *********************** General actuator ***********************
# [GeneralBufferActuator] core threads
realtime-etl.parser.general.thread-core-size=8
# [GeneralBufferActuator] max threads
realtime-etl.parser.general.max-thread-size=16
# [GeneralBufferActuator] queue capacity
realtime-etl.parser.general.thread-queue-capacity=64
# [GeneralBufferActuator] batch size per execution
realtime-etl.parser.general.buffer-writer-count=1000
# [GeneralBufferActuator] tasks consumed per tick
realtime-etl.parser.general.buffer-pull-count=20000
# [GeneralBufferActuator] buffer capacity
realtime-etl.parser.general.buffer-queue-capacity=50000
# [GeneralBufferActuator] consume interval (ms)
realtime-etl.parser.general.buffer-period-millisecond=300
# *********************** Table-group actuator ***********************
# [TableGroupBufferActuator] core threads
realtime-etl.parser.table.group.thread-core-size=1
# [TableGroupBufferActuator] max threads
realtime-etl.parser.table.group.max-thread-size=1
# [TableGroupBufferActuator] queue capacity
realtime-etl.parser.table.group.thread-queue-capacity=16
# [TableGroupBufferActuator] batch size per execution
realtime-etl.parser.table.group.buffer-writer-count=1000
# [TableGroupBufferActuator] tasks consumed per tick
realtime-etl.parser.table.group.buffer-pull-count=1000
# [TableGroupBufferActuator] buffer capacity
realtime-etl.parser.table.group.buffer-queue-capacity=10000
# [TableGroupBufferActuator] consume interval (ms)
realtime-etl.parser.table.group.buffer-period-millisecond=300

# Enable cluster mode (requires MySQL storage: realtime-etl.storage.type=mysql)
realtime-etl.cluster.enabled=false

#storage
# Storage type: h2 (default) / mysql (recommended for production)
realtime-etl.storage.type=h2
realtime-etl.storage.h2.url=jdbc:h2:file:./data/realtime-etl;MODE=MySQL;DB_CLOSE_DELAY=-1;TRACE_LEVEL_FILE=0;TRACE_LEVEL_SYSTEM_OUT=0
realtime-etl.storage.h2.username=sa
# For production encryption, configure before the first DB file is created (or delete the old DB and restart).
realtime-etl.storage.h2.password=
realtime-etl.storage.mysql.url=jdbc:mysql://127.0.0.1:3306/realtime-etl?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF8&serverTimezone=Asia/Shanghai&useSSL=false&verifyServerCertificate=false&autoReconnect=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
realtime-etl.storage.mysql.username=root
realtime-etl.storage.mysql.password=123
# [StorageBufferActuator] core threads
realtime-etl.storage.thread-core-size=4
# [StorageBufferActuator] max threads
realtime-etl.storage.max-thread-size=8
# [StorageBufferActuator] queue capacity
realtime-etl.storage.thread-queue-capacity=64
# [StorageBufferActuator]
realtime-etl.storage.buffer-writer-count=1000
# [StorageBufferActuator]
realtime-etl.storage.buffer-pull-count=20000
# [StorageBufferActuator] Cache queue capacity
realtime-etl.storage.buffer-queue-capacity=50000
# [StorageBufferActuator] Time Cache queue interval (ms)
realtime-etl.storage.buffer-period-millisecond=300