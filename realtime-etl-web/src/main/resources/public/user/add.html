<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Add User</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="userSubmitBtn" class="btn btn-primary">
                <i class="fa fa-save"></i> Save
            </button>
            <button class="btn btn-outline" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> Back
            </button>
        </div>
        <form id="user-form-add" method="post">
            <div class="grid grid-cols-2">
                <!-- Account -->
                <div class="form-item">
                    <label class="form-label">Account<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="username" type="text" maxlength="50" required
                               placeholder="Please enter the account number."/>
                    </div>
                </div>

                <!-- Nickname -->
                <div class="form-item">
                    <label class="form-label">Nickname<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="nickname" type="text" maxlength="50" required
                               placeholder="Please enter nickname"/>
                    </div>
                </div>

                <!-- Role -->
                <div class="form-item">
                    <label class="form-label">Role<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <select id="roleId" class="form-control" name="roleId" required>
                            <option value="">Please select a role</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r.id}"
                                    th:text="${r.name}"></option>
                        </select>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-item">
                    <label class="form-label">Password<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="password" type="password" maxlength="64" required
                               placeholder="Please enter password"/>
                    </div>
                </div>
            </div>
        </form>
        <!-- YesRole dbSelect Draw down to set up heights to avoid being hitform-container DisarmCut. -->
        <div class="blank-block-md"></div>
    </div>
</div>

<script type="text/javascript">
    $('#roleId').dbSelect({type: 'single'});

    //Save
    $("#userSubmitBtn").on('click', function () {
        const $form = $("#user-form-add");
        if (!validateForm($form)) {
            return;
        }

        const $btn = $(this);
        const originalText = $btn.html();
        $btn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
        doPoster("/user/add", $form.serializeJson(), function (response) {
            $btn.html(originalText).prop('disabled', false);
            if (response.success === true) {
                bootGrowl("Add user successfully!", "success");
                doLoader("/user?refresh=" + new Date().getTime());
            } else {
                bootGrowl(response.message || "New Failed", "danger");
            }
        });
    });
</script>
</html>
