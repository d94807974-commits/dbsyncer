<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
 <h3 class="card-title text-center">AddRevised Validation</h3>
    </div>

    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="validate-sync-submit-btn" type="button" class="btn btn-primary">
                <i class="fa fa-save"></i>
 Save
            </button>
            <button class="btn btn-outline" onclick="backIndexPage()">
 <i class="fa fa-reply"></i> Back
            </button>
        </div>

        <form id="validate-sync-add-form">
 <!-- CreateTask Selection -->
            <div class="grid grid-cols-4">
                <div id="task-create" class="radio-group">
                    <input type="radio" name="createType" value="link" checked />
 <label>Linked sync task</label>
                    <input type="radio" name="createType" value="custom" />
 <label>Custom</label>
                </div>
            </div>

            <div class="grid grid-cols-2 mt-5">
                <div class="form-item">
 <label class="form-label">Name<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
 <input class="form-control" name="name" type="text" maxlength="50" required placeholder="Enter task name"/>
                    </div>
                </div>
            </div>

 <!-- Custom Configuration -->
            <div id="custom-config" class="hidden mt-4">
 <!-- SourceandTarget -->
                <div class="grid grid-cols-2">
 <!-- Source -->
                    <div class="form-item">
                        <label class="form-label">
 <i class="fa fa-database text-primary"></i> Source<strong class="text-primary">*</strong>
                        </label>
                        <select name="sourceConnectorId" id="sourceConnectorId" class="form-control"></select>
                    </div>

 <!-- Target -->
                    <div class="form-item">
                        <label class="form-label">
 <i class="fa fa-database text-success"></i> Target<strong class="text-primary">*</strong>
                        </label>
                        <select name="targetConnectorId" id="targetConnectorId" class="form-control"></select>
                    </div>
                </div>

 <!-- Database 1/ -->
                <div class="grid grid-cols-2 mt-5">
                    <div class="form-item">
 <label class="form-label">Source database</label>
                        <select name="sourceDatabase" id="sourceDatabase" class="form-control"></select>
                    </div>
                    <div class="form-item">
 <label class="form-label">Target database</label>
                        <select name="targetDatabase" id="targetDatabase" class="form-control"></select>
                    </div>
                </div>

 <!-- SchemaConfigure -->
                <div class="grid grid-cols-2 mt-5">
                    <div class="form-item">
 <label class="form-label">Source schema</label>
                        <select name="sourceSchema" id="sourceSchema" class="form-control"></select>
                    </div>
                    <div class="form-item">
 <label class="form-label">Target schema</label>
                        <select name="targetSchema" id="targetSchema" class="form-control"></select>
                    </div>
                </div>

 <!-- DriverNameSimilar to matchingTable -->
                <div class="grid grid-cols-2 mt-5">
                    <div class="form-item">
 <label class="form-label"><i class="fa fa-table text-info"></i> Match similar tables</label>
                        <div class="form-control-area">
                            <label class="form-switch">
                                <input name="autoMatchTable" type="checkbox" />
                                <span class="switch-track">
                                    <span class="switch-option switch-option-on">Yes</span>
                                    <span class="switch-option switch-option-off">No</span>
                                    <span class="switch-thumb"></span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>

 <!-- Table mappings -->
                <div class="grid mt-5">
                    <div class="form-item" id="tableGroups">
                        <label class="form-label">
 Table mappings
 <i class="fa fa-question-circle" title="Useful when configuring many table mappings at once"></i>
                        </label>
                        <div>
 <textarea name="tableGroups" class="form-control" rows="10" placeholder="Enter table mappings, one per line..."></textarea>
                            <label class="text-gray-500">
 <span class="text-sm">SourceTable|TargetTable=SourceTableFieldA1*|TargetFieldA2*,SourceTableFieldB1|TargetFieldB2</span>
 <i class="fa fa-question-circle" title="'|'TableIconMappingRelations，'='TableBehind ExecutionYesTableFieldMappingRelations，How many?FieldEnglish','Collapse，'*'TableIconPrimary key，Like more.TableLine Break Add"></i>
                                <a class="text-sm" href="https://gitee.com/ghi/realtime-etl/wikis/%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8C/%E6%89%B9%E9%87%8F%E9%85%8D%E7%BD%AE%E8%A1%A8%E6%98%A0%E5%B0%84%E5%85%B3%E7%B3%BB"
 title="ActionsHandbook>Batch ConfigurationTable mappings" target='_blank'>
 <i class="fa fa-external-link"></i>Reference Documents
                                </a>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

 <!-- Association Configuration -->
            <div id="linked-config" class="hidden mt-4">
                <div class="grid grid-cols-2 mt-5">
                    <div class="form-item">
 <label class="form-label">Sync Tasks<strong class="text-primary">*</strong></label>
                        <select name="mappingId" id="mappingTask" class="form-control">
                        </select>
                    </div>
                </div>
            </div>

        </form>
    </div>
    <div class="blank-block"></div>
</div>

<script>
    function resolveConnectorType($connector, connectorId) {
        if (typeof resolveConnectorTypeFromSelect === 'function') {
            const dataType = resolveConnectorTypeFromSelect($connector, connectorId);
            if (dataType) {
                return dataType;
            }
        }
        if (!$connector || !connectorId) {
            return '';
        }
        const $option = $connector.find('option[value="' + connectorId + '"]');
        if (!$option.length) {
            return '';
        }
        const text = $option.text() || '';
        const match = text.match(/\(([^()]+)\)\s*$/);
        return match && match[1] ? match[1].trim() : '';
    }

    function isOracleConnector($connector, connectorId) {
        const type = resolveConnectorType($connector, connectorId);
 // Tamangnit! / OceanBaseOracle with Oracle Same as Schema(Users) None Namespace，No independent libraryList
        return type && ['oracle', 'dameng', 'oceanbaseoracle'].indexOf(String(type).toLowerCase()) >= 0;
    }

    function toggleDatabaseFieldVisibility($database, hide) {
        $database.closest('.form-item').toggleClass('hidden', !!hide);
    }

    function onDBChange(connectorId, schemaSelect, dbName, oracleMode) {
        schemaSelect.setData([]);
        schemaSelect.setValues([], true);
        if (!connectorId) {
            return;
        }
        if (!oracleMode && !dbName) {
            return;
        }
        doGetter('/connector/getSchema', {id: connectorId, database: dbName || ''}, function (response) {
            if (response.success && response.data) {
                let array = [];
                const schemas = response.data;
                if (schemas && schemas.length > 0) {
                    schemas.forEach(function (schema) {
                        array.push({label: schema, value: schema, disabled: false})
                    });
                }
                schemaSelect.setData(array);
            } else {
 bootGrowl("AccessSchemaInformationFailed: " + response.message, "danger");
            }
        })
    }

    function onConnectorChange(connectorId, dbSelect, schemaSelect, $connector, $database) {
        const oracleMode = isOracleConnector($connector, connectorId);
        toggleDatabaseFieldVisibility($database, oracleMode);

        dbSelect.setData([]);
        dbSelect.setValues([], true);
        schemaSelect.setData([]);
        schemaSelect.setValues([], true);
        if (!connectorId) {
            return;
        }
        if (oracleMode) {
            onDBChange(connectorId, schemaSelect, '', true);
            return;
        }
        doGetter('/connector/getDatabase', {id: connectorId}, function (response) {
            if (response.success && response.data) {
                const databases = response.data;
                let db = [];
                if (databases && databases.length > 0) {
                    databases.forEach(function (dbName) {
                        db.push({label: dbName, value: dbName, disabled: false})
                    });
                }
                dbSelect.setData(db);
            } else {
 bootGrowl("Failed to load database info: " + response.message, "danger");
            }
        })
    }

    function initDBSelect($connector, $database, $schema, role) {
 // As Every select The group revises its independence.ConnectorID，Avoid context string
        let currentConnectorId = null;

        const schemaSelect = $schema.dbSelect({});
        const dbSelect = $database.dbSelect({
            type: 'single',
            onSelect: function (selected) {
                if (currentConnectorId) {
                    onDBChange(currentConnectorId, schemaSelect, selected.length >= 1 ? selected[0] : '', false);
                }
            }
        });
        const connectorSelect = $connector.dbSelect(buildRemoteConnectorSelectOptions({
            role: role,
            onSelect: function (connectorId) {
                currentConnectorId = connectorId.length >= 1 ? connectorId[0] : '';
                onConnectorChange(currentConnectorId, dbSelect, schemaSelect, $connector, $database);
            }
        }));

        const selected = connectorSelect.getValues();
        if (selected.length >= 1) {
            currentConnectorId = selected[0];
            onConnectorChange(currentConnectorId, dbSelect, schemaSelect, $connector, $database);
        }
    }

    /**
 * Switch「Association Sync Entry / Custom」Show back-to-backTableSingle Area。
     */
    function showCreateType(model) {
        const custom = $("#custom-config");
        const linked = $("#linked-config");
        const mappingDbSelect = $("#mappingTask").data("dbSelect");
        if ('custom' === model) {
            custom.removeClass("hidden");
            linked.addClass("hidden");
            if (mappingDbSelect) {
                mappingDbSelect.clear();
            }
        } else {
            linked.removeClass("hidden");
            custom.addClass("hidden");
        }
    }

 // Bind Custom+Link Sync Task Switching Event
    function bindCreateTypeChange() {
        const createType = $('#task-create').radioGroup({
            theme: 'info',
            size: 'md',
            onChange: function (value, label) {
                showCreateType(value);
            }
        });
 // Render SelectionradioConfigure
        showCreateType(createType.getValue());
    }

    /**
 * Synchronise Task Down（Remote Page Break，YesUsersVisible selection）。
     */
    function initMappingSelect() {
        $("#mappingTask").dbSelect(buildRemotePagingSelectOptions({
            url: '/mapping/search',
            onSelect: function () {
            }
        }));
    }

    /**
 * Associated Sync Tasks ModeYesNoSelected Tasks（Exclude empty seats）。
     * @returns {boolean}
     */
    function hasMappingTaskSelected() {
        const api = $("#mappingTask").data("dbSelect");
        if (api && api.getValues().length > 0) {
            const v = api.getValues()[0];
            return !!(v && String(v).trim());
        }
        const v = $.trim($("#mappingTask").val() || "");
        return v.length > 0;
    }

    $(document).ready(function() {
        initDBSelect($('#sourceConnectorId'), $('#sourceDatabase'), $('#sourceSchema'), 'source');
        initDBSelect($('#targetConnectorId'), $('#targetDatabase'), $('#targetSchema'), 'target');

        bindCreateTypeChange();
        initMappingSelect();

 //Save
        $("#validate-sync-submit-btn").click(function () {
            const $form = $("#validate-sync-add-form");
            const createType = $form.find('input[name="createType"]:checked').val();
            if (createType === 'link' && !hasMappingTaskSelected()) {
 bootGrowl("Please selectSync Tasks", "warning");
                return;
            }
            if (validateForm($form)) {
                const btn = $(this);
                const originalText = btn.html();
 btn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
                /** @type {Record<string, string|string[]>} */
                let payload = $form.serializeJson();
                if (createType === 'custom') {
                    payload.mappingId = "";
                }
                doPoster("/validate-sync/add", payload, function (response) {
                    btn.html(originalText).prop('disabled', false);
                    if (response.success === true) {
 bootGrowl("SaveRevised ValidationSuccess!", "success");
                        const rawStr = localStorage.getItem("realtime-etl.pagination.validate-sync-list");
                        const raw = JSON.parse(rawStr);
                        raw.pageNum = 1;
                        localStorage.setItem('realtime-etl.pagination.validate-sync-list', JSON.stringify(raw));
                        backIndexPage();
                    } else {
                        bootGrowl(response.message, "danger");
                    }
                });
            }
        });
    })
</script>
</html>
