<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content" id="mapping_increment" class="hidden py-3">
    <!-- IncrementalStrategySelection -->
    <div class="grid grid-cols-4">
        <div id="increment_strategy" class="radio-group">
            <input type="radio" name="incrementStrategy" value="log" th:checked="${'log' eq mapping?.listener?.listenerType}" />
            <label>Logs</label>
            <input type="radio" name="incrementStrategy" value="timing" th:checked="${'timing' eq mapping?.listener?.listenerType}" />
            <label>Scheduled</label>
        </div>
    </div>

    <!-- IncrementalPoints 71Config -->
    <table class="table" th:if="${mapping?.meta?.snapshot.size() gt 0}">
        <thead>
        <tr>
            <th></th>
            <th>Key</th>
            <th>Value</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="mappingMetaSnapshotConfig">
        <tr th:each="item,s:${mapping?.meta?.snapshot}">
            <td th:text="${s.count}"/>
            <td>[[${item.key}]]</td>
            <td>[[${item.value}]]</td>
            <td>
                <button type="button" class="table-action-btn view metaSnapshotModify" title="Edit">
                    <i class="fa fa-edit"></i>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
    <input id="metaSnapshot" name="metaSnapshot" class="hidden" type="text"/>

    <!-- Time Configuration -->
    <div th:id="increment_quartz" class="hidden">
        <div th:replace="mapping/editQuartz :: content"></div>
    </div>

    <!-- Incremental eventsConfig -->
    <p><i class="fa fa-send text-success"></i> Incremental events</p>
    <div class="grid grid-cols-4">
        <div class="form-item">
            <label class="form-label">Add</label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="enableInsert" th:checked="${mapping?.listener?.enableInsert}" type="checkbox" />
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Edit</label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="enableUpdate" th:checked="${mapping?.listener?.enableUpdate}" type="checkbox" />
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">Delete</label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="enableDelete" th:checked="${mapping?.listener?.enableDelete}" type="checkbox" />
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
        <div class="form-item">
            <label class="form-label">DDL</label>
            <div class="form-control-area">
                <label class="form-switch">
                    <input name="enableDDL" th:checked="${mapping?.listener?.enableDDL}" type="checkbox" />
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
    </div>

</div>

</html>
