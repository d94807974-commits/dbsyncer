<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Sync Event Details（Take over.Monitor「Query Data」） -->
<div class="form-container" id="mappingEventsPage"
     th:attr="data-mapping-id=${mappingId},data-table-group-id=${tableGroupId}">
    <div class="card-header">
        <h3 class="card-title text-center">Sync Event Details</h3>
    </div>
    <div class="card-body">
        <div class="grid grid-cols-6 items-end mb-4">
            <div class="lg:col-span-2 form-item mb-0">
                <label class="form-label">Status</label>
                <select id="searchDataStatus" class="form-control">
                    <option value="-1" th:selected="${dataStatus == null or dataStatus == '-1'}">All</option>
                    <option value="0" th:selected="${dataStatus == '0'}">Failed</option>
                    <option value="1" th:selected="${dataStatus == '1'}">Success</option>
                </select>
            </div>
            <div class="lg:col-span-4 flex items-center justify-end">
                <button id="clearDataBtn" type="button" class="btn btn-outline mr-2">
                    Empty Current Table Data
                </button>
                <button type="button" class="btn btn-outline" onclick="backDetailPage()">
                    <i class="fa fa-reply"></i> Return Details
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th></th>
                <th>Target table</th>
                <th>Event</th>
                <th>Result</th>
                <th>Error</th>
                <th>Time</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
        <div class="blank-block"></div>
    </div>
</div>

<script th:src="@{/js/mapping/mapping-events.js}"></script>
</html>
