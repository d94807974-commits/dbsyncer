<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <!-- Policy ConfigurationTitle-->
    <p><i class="fa fa-cogs text-primary"></i> Policy Configuration</p>

    <div class="form-item">
        <label class="form-label">
            Overwrite <i class="fa fa-question-circle" title="Yes - implement insert when data are not available in target table; no - not effective"></i>
        </label>
        <div class="form-control-area">
            <label class="form-switch">
                <input name="forceUpdate" th:checked="${mapping?.forceUpdate}" type="checkbox" />
                <span class="switch-track">
                    <span class="switch-option switch-option-on">Yes</span>
                    <span class="switch-option switch-option-off">No</span>
                    <span class="switch-thumb"></span>
                </span>
            </label>
        </div>
    </div>
</div>

</html>
