<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content" id="mapping_full">
    <!-- ConfigForm-->
    <div class="grid grid-cols-4">
        <!-- Batch read -->
        <div class="form-item">
            <label class="form-label">
                Batch read <strong class="text-primary">*</strong>
            </label>
            <div class="form-control-area">
                <input th:value="${mapping?.readNum}" type="number" name="readNum" class="form-control"
                       min="1" max="200000" required placeholder="1-200000" />
            </div>
        </div>

        <!-- Single write -->
        <div class="form-item">
            <label class="form-label">
                Single write <strong class="text-primary">*</strong>
            </label>
            <div class="form-control-area">
                <input th:value="${mapping?.batchNum}" type="number" name="batchNum" class="form-control" min="1" max="20000"
                       required placeholder="1-20000" />
            </div>
        </div>

        <!-- Threads -->
        <div class="form-item">
            <label class="form-label">
                Threads <strong class="text-primary">*</strong>
                <i class="fa fa-question-circle" title="Number of tables to be executed in parallel when fully synchronized. Do not exceed the size of the source/target connect pool"></i>
            </label>
            <div class="form-control-area">
                <input th:value="${mapping?.threadNum}" type="number" name="threadNum" class="form-control" min="1" max="64"
                       required placeholder="1-64" />
            </div>
        </div>

        <!-- Executors（OnlyProfessional） -->
        <div th:if="${editionInfo != null and editionInfo.edition ne 'community'}" class="form-item">
            <label class="form-label">
                Executors <strong class="text-primary">*</strong>
                <i class="fa fa-question-circle" title="by, and up to, 64 Modify to stop the task before it starts."></i>
            </label>
            <div class="form-control-area">
                <select id="channelSize" name="channelSize" class="form-control" required>
                    <option value="1" th:selected="${mapping?.channelSize == 1}">1</option>
                    <option value="2" th:selected="${mapping?.channelSize == 2}">2</option>
                    <option value="4" th:selected="${mapping?.channelSize == 4}">4</option>
                    <option value="8" th:selected="${mapping?.channelSize == 8 or mapping?.channelSize == null}">8</option>
                    <option value="16" th:selected="${mapping?.channelSize == 16}">16</option>
                    <option value="32" th:selected="${mapping?.channelSize == 32}">32</option>
                    <option value="64" th:selected="${mapping?.channelSize == 64}">64</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            if ($('#channelSize').length) {
                initSelect($('#channelSize'));
            }
        });
    </script>
</div>
</html>
