<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Resource authorization</h3>
    </div>
    <div class="card-body">
        <div class="flex items-center justify-between gap-2 flex-wrap mb-4">
            <div class="flex items-center gap-2 flex-wrap flex-1 min-w-0">
                <label class="form-label whitespace-nowrap" for="filterSubjectType">License type</label>
                <div class="group-filter-wrap flex-shrink-0 w-320">
                    <select id="filterSubjectType" class="form-control">
                        <option value="" selected>All</option>
                        <option value="0">User</option>
                        <option value="1">Role</option>
                    </select>
                </div>
                <label class="form-label whitespace-nowrap" for="filterSubjectId">User/role</label>
                <div class="group-filter-wrap flex-shrink-0 w-320">
                    <select id="filterSubjectId" class="form-control">
                        <option value="" selected>All</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <button type="button" id="resetBtn" class="btn btn-outline">Reset</button>
                <button class="btn btn-primary" type="button" data-permission="acl:edit"
                        onclick="doLoader('/acl/page/add')">
                    <i class="fa fa-plus"></i> Add
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>License type</th>
                <th>User/role</th>
                <th>Resource type</th>
                <th>Resource</th>
                <th>Permission</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="aclList"></tbody>
        </table>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const aclUsers = /*[[${users}]]*/ [];
    const aclRoles = /*[[${roles}]]*/ [];
    /*]]>*/

    (function () {
        'use strict';

        const RESOURCE_TYPE_NAMES = {
            group: 'Business group',
            connector: 'Connect',
            mapping: 'Sync task',
            validateSync: 'Revised verification tasks',
            databaseSync: 'Library Migration Task'
        };

        function resourceTypeName(type) {
            return RESOURCE_TYPE_NAMES[type] || (type || '');
        }

        function getSelectValue(api, $el) {
            if (api && typeof api.getValues === 'function') {
                const vals = api.getValues();
                return vals.length ? (vals[0] || '') : '';
            }
            return $el.val() || '';
        }

        function setSelectValue(api, $el, value) {
            if (api && typeof api.setValues === 'function') {
                api.setValues([value], true);
            } else {
                $el.val(value);
            }
        }

        function buildSubjectOptions(subjectType) {
            const $select = $('#filterSubjectId');
            $select.empty().append('<option value="">All</option>');
            if (subjectType === '0') {
                (aclUsers || []).forEach(function (u) {
                    if (!u || !u.id) {
                        return;
                    }
                    const label = (u.nickname || '') + (u.username ? ' (' + u.username + ')' : '');
                    $select.append($('<option></option>').attr('value', u.id).text(label || u.id));
                });
            } else if (subjectType === '1') {
                (aclRoles || []).forEach(function (r) {
                    if (!r || !r.id) {
                        return;
                    }
                    $select.append($('<option></option>').attr('value', r.id).text(r.name || r.id));
                });
            }
        }

        function collectParams() {
            return {
                subjectType: getSelectValue(subjectTypeSelect, $('#filterSubjectType')),
                subjectId: getSelectValue(subjectIdSelect, $('#filterSubjectId'))
            };
        }

        const pagination = new PaginationManager({
            requestUrl: '/acl/query',
            tableBodySelector: '#aclList',
            pageSize: 10,
            customPageSize: true,
            customPageSizeItems: [5, 10, 20, 50, 100],
            storageKey: 'acl.list',
            showBoundaryButtons: true,
            emptyHtml: '<td colspan="6" class="text-center text-tertiary py-8">No authority for resources</td>',
            renderRow: function (a) {
                const id = escapeHtml(a.id || '');
                return '<tr>'
                    + '<td><span class="badge">' + escapeHtml(a.subjectTypeName || '') + '</span></td>'
                    + '<td>' + escapeHtml(a.subjectName || '') + '</td>'
                    + '<td><span class="text-sm">' + escapeHtml(resourceTypeName(a.resourceType)) + '</span></td>'
                    + '<td>' + escapeHtml(a.resourceName || '') + '</td>'
                    + '<td><span class="text-sm text-secondary">' + escapeHtml(a.permissionName || '') + '</span></td>'
                    + '<td><div class="flex items-center">'
                    + '<button type="button" class="table-action-btn view editAclBtn" title="Edit" data-id="' + id
                    + '" data-permission="acl:edit"><i class="fa fa-edit"></i></button>'
                    + '<button type="button" class="table-action-btn delete removeAclBtn" title="Delete" data-id="' + id
                    + '" data-permission="acl:edit"><i class="fa fa-trash"></i></button>'
                    + '</div></td>'
                    + '</tr>';
            },
            refreshCompleted: function () {
                if (window.DBSPermission && typeof DBSPermission.apply === 'function') {
                    DBSPermission.apply($('#aclList'));
                }
                $('#aclList .editAclBtn').off('click').on('click', function () {
                    doLoader('/acl/page/edit?id=' + $(this).data('id'));
                });
                $('#aclList .removeAclBtn').off('click').on('click', function () {
                    const id = $(this).data('id');
                    const $btn = $(this);
                    showConfirm({
                        title: 'Finance the removal of authority for this resource?',
                        icon: 'warning',
                        size: 'large',
                        confirmType: 'danger',
                        onConfirm: function () {
                            const originalText = $btn.html();
                            $btn.html('<i class="fa fa-spinner fa-spin"></i>').prop('disabled', true);
                            doPoster('/acl/remove', {id: id}, function (data) {
                                $btn.html(originalText).prop('disabled', false);
                                if (data.success === true) {
                                    bootGrowl('Deleted successfully!', 'success');
                                    pagination.doSearch(collectParams());
                                } else {
                                    bootGrowl(data.message || 'Delete failed', 'danger');
                                }
                            });
                        }
                    });
                });
            }
        });

        function search() {
            pagination.doSearch(collectParams(), 1);
        }

        function bindSubjectIdSelect() {
            return $('#filterSubjectId').dbSelect({
                type: 'single',
                onSelect: function () {
                    search();
                }
            });
        }

        buildSubjectOptions('');
        const subjectTypeSelect = $('#filterSubjectType').dbSelect({
            type: 'single',
            onSelect: function (values) {
                const type = values && values.length ? (values[0] || '') : '';
                buildSubjectOptions(type);
                if (subjectIdSelect && typeof subjectIdSelect.destroy === 'function') {
                    subjectIdSelect.destroy();
                }
                subjectIdSelect = bindSubjectIdSelect();
                search();
            }
        });
        let subjectIdSelect = bindSubjectIdSelect();

        $('#resetBtn').on('click', function () {
            setSelectValue(subjectTypeSelect, $('#filterSubjectType'), '');
            buildSubjectOptions('');
            if (subjectIdSelect && typeof subjectIdSelect.destroy === 'function') {
                subjectIdSelect.destroy();
            }
            subjectIdSelect = bindSubjectIdSelect();
            setSelectValue(subjectIdSelect, $('#filterSubjectId'), '');
            search();
        });

        window.backIndexPage = function () {
            doLoader('/acl');
        };
    })();
</script>
</html>
