<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container" id="databaseSyncerDetailPage" th:attr="data-task-id=${taskId}">
    <div class="card-header">
        <h3 class="card-title text-center">Details of migration results</h3>
    </div>
    <div class="card-body">
        <div class="grid grid-cols-6 items-center mb-4">
            <div class="lg:col-span-2 flex items-center">
                <label class="form-label mr-3 whitespace-nowrap">Select Task</label>
                <select id="detailTaskSelect" class="form-control"
                        th:attr="data-default-id=${taskId}, data-default-label=${taskName}"></select>
            </div>
            <div class="lg:col-span-2 flex items-center">
                <label class="form-label mr-3 whitespace-nowrap">Migration type</label>
                <select id="detailTypeFilter" class="form-control">
                    <option value="" th:selected="${detailType == null or detailType == ''}">All</option>
                    <option value="rowData" th:selected="${detailType == 'rowData'}">Data Migration</option>
                    <option value="tableSchema" th:selected="${detailType == 'tableSchema'}">Table schema</option>
                </select>
            </div>
            <div class="lg:col-span-2 flex items-center">
                <label class="form-label mr-3 whitespace-nowrap">Status</label>
                <select id="detailStatusFilter" class="form-control">
                    <option value="" th:selected="${detailStatus == null or detailStatus == ''}">All</option>
                    <option value="success" th:selected="${detailStatus == 'success'}">Success</option>
                    <option value="fail" th:selected="${detailStatus == 'fail'}">Failed</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-6 items-center mb-4">
            <div class="lg:col-span-4"></div>
            <div class="lg:col-span-2 flex items-center justify-end">
                <button class="btn btn-outline" onclick="backIndexPage()">
                    <i class="fa fa-reply"></i> Back to list
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th class="width50px"></th>
                <th>Migration type</th>
                <th>Source database</th>
                <th>Source table</th>
                <th>Target database</th>
                <th>Target table</th>
                <th>Source Lines</th>
                <th>Successes</th>
                <th>Failures</th>
                <th>Updated At</th>
                <th class="width80px">View details</th>
            </tr>
            </thead>
            <tbody id="detail-result-table"></tbody>
        </table>
        <div class="blank-block"></div>
    </div>
</div>

<script th:src="@{/js/database-sync/database-sync-detail.js}"></script>
</html>
