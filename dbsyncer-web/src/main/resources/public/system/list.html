<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">System settings</h3>
    </div>
    <div class="card-body">
        <form id="config-form-edit">
            <!-- AdministratorActionsRegional-->
            <div class="form-actions mb-4">
                <button id="updateSystemBtn" type="button" class="btn btn-primary" data-permission="system:edit">
                    <span class="fa fa-save"></span> Save
                </button>
            </div>
            <div class="grid grid-cols-2">
                <div class="form-item">
                    <label class="form-label">Record synchronised successful data</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStorageWriteSuccess" th:checked="${config?.enableStorageWriteSuccess}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Record full volume data<i class="fa fa-question-circle"
                                                             title="Not recommended to open in a production environment, which can be used when the amount of the database is small and generally for testing"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStorageWriteFull" th:checked="${config?.enableStorageWriteFull}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Recording Synchronising Failed Data</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableStorageWriteFail" th:checked="${config?.enableStorageWriteFail}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Record failed log length<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1024" max="8192" required
                               name="maxStorageErrorLength" th:value="${config?.maxStorageErrorLength}"/>
                    </div>
                </div>
                <div th:if="${editionInfo != null and editionInfo.edition ne 'community'}" class="form-item">
                    <label class="form-label">Cluster Access Key<i class="fa fa-question-circle"
                                                             title="Internal interfaces between cluster nodes shared with key and production cluster nodes must be configured with the same values to prevent undiscovered start-ups"></i></label>
                    <div class="form-control-area flex">
                        <input type="text" class="form-control" name="clusterSecret"
                               th:value="${config?.clusterSecret}"/>
                        <div class="form-actions ml-2">
                            <button type="button" class="btn btn-outline" id="generateClusterSecret">
                                <span class="fa fa-refresh"></span> Generate
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Promotion<i class="fa fa-question-circle"
                                                               title="For each additional map of a synchronized tasksheet, a separate table implementer is used, and after this limit is exceeded, a universal implementer is used."></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="200" required
                               name="maxBufferActuatorSize" th:value="${config?.maxBufferActuatorSize}"/>
                    </div>
                </div>
                <div th:if="${editionInfo != null and editionInfo.edition ne 'community'}" class="form-item">
                    <label class="form-label">Full and multiple.<i class="fa fa-question-circle"
                                                             title="Full assignment (full synchronisation, revised verification, inventory migration) and number of processing forms issued"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="64" required
                               name="maxTableCount" th:value="${config?.maxTableCount}"/>
                    </div>
                </div>
                <div th:if="${editionInfo != null and editionInfo.edition ne 'community'}" class="form-item">
                    <label class="form-label">Full split and multiple.<i class="fa fa-question-circle"
                                                           title="Synchronization of tasks (full synchronization, revision of verification, inventory migration) and processing of fractions"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="64" required
                               name="maxPlanCount" th:value="${config?.maxPlanCount}"/>
                    </div>
                </div>
                <div th:if="${editionInfo != null and editionInfo.edition ne 'community'}" class="form-item">
                    <label class="form-label">Total number of segments<i class="fa fa-question-circle"
                                                         title="Splits the number of pre-slices per wave from the number of single-readable x-lines of the task; cut the next after this wave has been fully completed Wave"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="10000000" required
                               name="shardTotal" th:value="${config?.shardTotal}"/>
                    </div>
                </div>
                <div th:if="${editionInfo != null and editionInfo.edition ne 'community'}" class="form-item">
                    <label class="form-label">Period timeout (ms)<i class="fa fa-question-circle"
                                                               title="Run-time fractions beyond that time are considered timeout without refreshing"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="60000" max="3600000" required
                               name="shardTimeoutMs" th:value="${config?.shardTimeoutMs}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">10. Synchronization of data expiration time (days)<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="180" required name="expireDataDays"
                               th:value="${config?.expireDataDays}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">System log expiration time (days)<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="180" required name="expireLogDays"
                               th:value="${config?.expireLogDays}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Log file expiry time (days)<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="180" required name="expireFileLogDays"
                               th:value="${config?.expireFileLogDays}"/>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Login locking time (minutes)<i class="fa fa-question-circle"
                                                                  title="When successive login failed to reach the ceiling and lock the account number Long"></i><strong
                            class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input type="number" class="form-control" min="1" max="1440" required name="loginLockMinutes"
                               th:value="${config?.loginLockMinutes}"/>
                    </div>
                </div>
            </div>
            <div class="grid mt-5 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">Watermark<i class="fa fa-question-circle" title="Synchronising folder"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input id="enableWatermark" name="enableWatermark" th:checked="${config?.enableWatermark}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label watermark hidden">Watermark Content Income</label>
                    <div class="form-control-area watermark hidden">
                        <input type="text" class="form-control" maxlength="64" name="watermark"
                               placeholder="Please enter a watermark (up to 64 words)." th:value="${config?.watermark}"/>
                    </div>
                </div>
            </div>
            <div class="grid mt-5 grid-cols-2">
                <div class="form-item">
                    <label class="form-label">Can not open message<i class="fa fa-question-circle"
                                                              title="Question only, production environment recommended closed"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enablePrintTraceInfo" th:checked="${config?.enablePrintTraceInfo}"
                                   type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- OpenAPIConfig -->
            <div class="grid mt-5 grid-cols-1 lg:grid-cols-3">
                <div class="form-item lg:col-span-2">
                    <label class="form-label">Open api<i class="fa fa-question-circle"
                                                        title="This configuration allows external operating systems to generate token, directly to the DBSyncer management interface, and synchronize data."></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="enableOpenAPI" th:checked="${config?.enableOpenAPI}" type="checkbox"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item lg:col-span-2">
                    <label class="form-label open-api hidden">API Key<i class="fa fa-question-circle"
                                                                        title="Used to generate token access to OpenAPI, if generated, please keep it safe"></i></label>
                    <div class="form-control-area flex">
                        <input type="text" class="form-control open-api hidden" name="apiSecret"
                               th:value="${config?.currentSecret}"/>
                        <div class="form-actions ml-2">
                            <button type="button" class="open-api hidden btn btn-outline" id="copyApiSecretBtn">
                                <i class="fa fa-copy"></i> Copy
                            </button>
                            <button type="button" class="open-api hidden btn btn-outline" id="generateApiSecret">
                                <span class="fa fa-refresh"></span> Generate
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid mt-5 grid-cols-1 lg:grid-cols-3">
                <div class="form-item lg:col-span-2">
                    <label class="form-label open-api hidden">RSA Length<i class="fa fa-question-circle"
                                                                        title="allowed input ranges [1024,2048,4096,8192]"></i></label>
                    <div class="form-control-area flex">
                        <input type="number" class="form-control open-api hidden" name="rsaKeyLength" min="1024"
                               max="8192" placeholder="Permission to enter ranges [1024-8192]"
                               th:value="${config?.currentRsa?.keyLength}?: 2048"/>
                        <button id="generateRSA" type="button" class="open-api hidden btn btn-outline ml-2">
                            <span class="fa fa-refresh"></span> Generate
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid mt-5 open-api hidden">
                <div class="form-item">
                    <label class="form-label">RSA Public Key</label>
                    <div class="form-control-area">
                        <textarea name="rsaPublicKey" class="form-control" disabled maxlength="8192" rows="5">[[${config?.currentRsa?.publicKey}]]</textarea>
                        <button type="button" class="btn btn-outline mt-1" id="copyPublicKeyBtn">
                            <i class="fa fa-copy"></i> Copy
                        </button>
                    </div>
                </div>

                <div class="form-item">
                    <label class="form-label">RSA private key</label>
                    <div class="form-control-area">
                        <textarea name="rsaPrivateKey" class="form-control" disabled maxlength="8192" rows="10">[[${config?.currentRsa?.privateKey}]]</textarea>
                        <button type="button" class="btn btn-outline mt-1" id="copyPrivateKeyBtn">
                            <i class="fa fa-copy"></i> Copy
                        </button>
                    </div>
                </div>
            </div>

            <!-- IP whitelist -->
            <div class="grid grid-cols-2 mt-5 open-api hidden">
                <div class="form-item">
                    <label class="form-label">IP whitelist<i class="fa fa-question-circle"
                                                         title="OpenAPI"></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="ipWhitelistEnabled" th:checked="${config?.ipWhitelistConfig?.enabled}"
                                   type="checkbox" value="true"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item ip-whitelist-detail">
                    <label class="form-label">Allow Local Access<i class="fa fa-question-circle"
                                                             title="127.0.0.1, localhost, etc."></i></label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="ipWhitelistAllowLocalhost"
                                   th:checked="${config?.ipWhitelistConfig?.allowLocalhost != null ? config.ipWhitelistConfig.allowLocalhost : true}"
                                   type="checkbox" value="true"/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item ip-whitelist-detail">
                    <label class="form-label">IP whitelist</label>
                    <div class="form-control-area">
                        <textarea name="ipWhitelist" class="form-control" rows="5"
                                  placeholder="One per line, support: individual IP, CIDR (192.168.1.0/24), scope (192.168.1.1-192.168.1.100)">[[${config?.ipWhitelistText}]]</textarea>
                    </div>
                </div>
            </div>

        </form>
        <div class="blank-block-md"></div>

    </div>
</div>

<script>
    $(function () {
        const watermark = $('.watermark');
        const openApiItems = $(".open-api");
        const rsaKeyLength = $("input[name='rsaKeyLength']");
        const apiSecret = $("input[name='apiSecret']");
        const clusterSecret = $("input[name='clusterSecret']");
        const rsaPublicKey = $("textarea[name='rsaPublicKey']");
        const rsaPrivateKey = $("textarea[name='rsaPrivateKey']");
        const generateApiSecretBtn = $("#generateApiSecret");
        const generateClusterSecretBtn = $("#generateClusterSecret");
        const generateRSABtn = $("#generateRSA");
        const copyApiSecretBtn = $("#copyApiSecretBtn");
        const copyPublicKeyBtn = $("#copyPublicKeyBtn");
        const copyPrivateKeyBtn = $("#copyPrivateKeyBtn");

        function toggleWatermark(checked) {
            if (checked) {
                watermark.show();
            } else {
                watermark.hide();
            }
        }

        let switchApi = initSwitch($('#enableWatermark'), toggleWatermark);
        toggleWatermark(switchApi.isChecked());

        //Save
        $("#updateSystemBtn").click(function () {
            const $form = $("#config-form-edit");
            if (validateForm($form)) {
                // verifieEditParameter
                rsaPublicKey.prop('disabled', false);
                rsaPrivateKey.prop('disabled', false);
                const submitBtn = $(this);
                const originalText = submitBtn.html();
                submitBtn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
                doPoster('/system/edit', $form.serializeJson(), function (response) {
                    submitBtn.html(originalText).prop('disabled', false);
                    if (response.success === true) {
                        bootGrowl("Change successful!", "success");
                        doLoader("/system");
                    } else {
                        bootGrowl(response.message, "danger");
                    }
                });
            }
        });

        generateRSABtn.click(function () {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> Generating...').prop('disabled', true);
            doPoster('/system/generateRSA', {'keyLength': rsaKeyLength.val()}, function (response) {
                btn.html(originalText).prop('disabled', false);
                if (response.success === true) {
                    rsaPublicKey.text(response.data.publicKey);
                    rsaPrivateKey.text(response.data.privateKey);
                    bootGrowl("Generate RSA successfully!", "success");
                } else {
                    bootGrowl(response.message, "danger");
                }
            });
        });

        // Generate API KeyOpenAPI Login)
        generateApiSecretBtn.click(function () {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> Generating...').prop('disabled', true);
            doPoster('/system/generateApiSecret', {}, function (response) {
                btn.html(originalText).prop('disabled', false);
                if (response.success === true && response.data) {
                    const secret = response.data;
                    apiSecret.val(secret);
                    bootGrowl("Generate API keys successfully!", "success");
                } else {
                    bootGrowl(response.message || "danger");
                }
            });
        });

        // Generate Cluster Access Key
        generateClusterSecretBtn.click(function () {
            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> Generating...').prop('disabled', true);
            doPoster('/system/generateApiSecret', {}, function (response) {
                btn.html(originalText).prop('disabled', false);
                if (response.success === true && response.data) {
                    const secret = response.data;
                    clusterSecret.val(secret);
                    bootGrowl("Generate cluster key successful!", "success");
                } else {
                    bootGrowl(response.message || "danger");
                }
            });
        });

        function bindCopyBtn(btn, element, content) {
            // Remove the old one first.EventTie it up.
            btn.off('click');
            btn.on('click', function () {
                const text = element.val();
                if (isBlank(text)) {
                    bootGrowl(content + "Other Organiser", "warning");
                    return;
                }
                copyToClipboard(text, {
                    button: $(this),
                    successMessage: "Copy" + content + "Success!",
                    originalText: "Copy",
                    originalIcon: "fa-copy"
                });
            });
        }

        // TieCopybuttonEvent
        function bindCopyButtons() {
            bindCopyBtn(copyApiSecretBtn, apiSecret, "API Key");
            bindCopyBtn(copyPublicKeyBtn, rsaPublicKey, "RSA Public Key");
            bindCopyBtn(copyPrivateKeyBtn, rsaPrivateKey, "RSA private key");
        }

        const ipWhitelistDetail = $(".ip-whitelist-detail");

        function toggleIpWhitelistDetail(checked) {
            if (checked) {
                ipWhitelistDetail.show();
            } else {
                ipWhitelistDetail.hide();
            }
        }

        let ipWhitelistSwitch = initSwitch($("input[name='ipWhitelistEnabled']"), toggleIpWhitelistDetail);

        function toggleOpenApiItem(checked) {
            rsaKeyLength.prop('disabled', !checked);
            generateRSABtn.prop('disabled', !checked);
            if (checked) {
                openApiItems.show();
                toggleIpWhitelistDetail(ipWhitelistSwitch.isChecked());
                // Delay binding after displaying areaEvent，EnsureDOM Element Rendered
                setTimeout(function () {
                    bindCopyButtons();
                }, 100);
                if (isBlank(apiSecret.val())) {
                    generateApiSecretBtn.click();
                }
                if (isBlank(rsaPublicKey.val()) && isBlank(rsaPrivateKey.val())) {
                    generateRSABtn.click();
                }
                return;
            }
            openApiItems.hide();
        }

        let enableOpenAPI = initSwitch($("input[name='enableOpenAPI']"), toggleOpenApiItem);
        const enableOpenAPIChecked = enableOpenAPI.isChecked();
        toggleOpenApiItem(enableOpenAPIChecked);
        // If at firstStatusJust...YesShowRSA Config，It needs to be tied.Event
        if (enableOpenAPIChecked) {
            setTimeout(function () {
                bindCopyButtons();
            }, 100);
        }

        // OffNotes.IP whitelist Switch Show / Hide「Allow Local Access」and「IP whitelist」Input Box
        toggleIpWhitelistDetail(ipWhitelistSwitch.isChecked());
    })
</script>
</html>
