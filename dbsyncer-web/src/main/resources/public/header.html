<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Top Department Navigator -->
<header th:fragment="header" class="app-header h-14 border-b border-gray-200 flex items-center justify-between">
    <div class="flex items-center">
        <button id="sidebarToggle" type="button" class="sidebar-toggle" title="Collapse sidebar">
            <i class="fa fa-bars"></i>
        </button>
    </div>
    <div class="flex items-center">
        <div id="licenseInfo" class="hidden">
            <div class="dropdown license-dropdown flex items-center">
                <button id="licenseToggle" class="license-trigger flex items-center text-gray-500 text-sm" data-toggle type="button">
                    <span class="items-center" id="editionName">Professional</span>
                    <img id="licenseCheck" class="hidden items-center m-1" draggable="false" width="18" height="18" th:src="@{'/img/license/check.png'}">
                    <img id="licenseRemind" class="hidden items-center m-1" draggable="false" width="18" height="18" th:src="@{'/img/license/remind.png'}">
                    <img id="licenseWarning" class="hidden items-center m-1" draggable="false" width="18" height="18" th:src="@{'/img/license/warning.png'}">
                    <span id="licenseAttention" class="hidden items-center license-attention"></span>
                    <span id="effectiveContent" class="hidden items-center license-effective-content"></span>
                    <i id="licenseArrow" class="fa fa-angle-down hidden"></i>
                </button>
                <ul id="licenseDropdownMenu" class="dropdown-menu license-dropdown-menu hidden">
                    <li class="license-dropdown-title">License status</li>
                    <div id="licenseProductDivider" class="dropdown-divider hidden"></div>
                    <div class="dropdown-divider"></div>
                    <li>
                        <button type="button" onclick="doLoader('/license')">
                            <i class="fa fa-key"></i> View license details
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <div class="dropdown flex items-center m-2">
            <button class="flex items-center text-gray-500" data-toggle>
                <i class="fa fa-user-circle user-avatar badge-primary"></i>
                <span id="currentUser" class="md:inline font-medium ml-2"></span>
                <i class="fa fa-angle-down"></i>
            </button>
            <!-- UserDown Additional Menu-->
            <ul class="dropdown-menu hidden">
                <li><button onclick="doLoader('/user/page/edit')"><i class="fa fa-edit"></i> Edit</button></li>
                <div class="dropdown-divider"></div>
                <li><button onclick="logout()"><i class="fa fa-power-off"></i> Logout</button></li>
            </ul>
        </div>
    </div>
</header>

</html>
