<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="index">
    <!-- StatisticsCut.Snippets -->
    <div class="grid grid-cols-4 mb-5">
        <div class="card px-6" id="totalMeta"></div>

        <div class="card px-6" id="runningMeta"></div>

        <div class="card px-6">
            <div class="flex items-center justify-between">
                <p class="text-gray-500">Failed Tasks</p>
                <div class="w-10 h-10 rounded-full bg-danger/10 flex items-center justify-center text-error">
                    <i class="fa fa-exclamation-triangle"></i>
                </div>
            </div>
            <div class="flex items-end">
                <span class="text-xxl font-bold" id="failMeta"></span>
            </div>
            <p class="text-xs text-gray-500 mt-1">It needs immediate attention.</p>
        </div>

        <div class="card px-6" id="allData"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 mb-5">
        <!-- Sync TrendsChart -->
        <div class="form-container lg:col-span-2 px-3">
            <div class="flex items-center justify-between mt-2">
                <h3 class="font-bold text-lg">Sync Trends</h3>
                <div>
                    <button class="btn btn-outline text-sm trend-item mr-1 text-primary" data-key="7">7 Days</button>
                    <button class="btn btn-outline text-sm trend-item mr-1" data-key="15">15 Days</button>
                    <button class="btn btn-outline text-sm trend-item mr-3" data-key="30">30 Days</button>
                </div>
            </div>
            <canvas id="trendChart"></canvas>
        </div>

        <!-- StatisticsCut.Snippets -->
        <div class="form-container lg:col-span-1 p-5">
            <div id="statistic" class="mini-stats-grid mb-3"></div>

            <!-- TaskStatusminBattery -->
            <canvas id="statusDoughnutChart"></canvas>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3">
        <!-- Left:ConnectList -->
        <div class="form-container p-5">
            <div class="border-gray-100 flex justify-end mb-5">
                <button class="btn btn-info" onclick="doLoader('/connector/page/add')" data-permission="connector:edit">
                    <i class="fa fa-plus"></i>
                    <span>Add Connection</span>
                </button>
            </div>
            <div id="connectorTable"></div>
            <div id="connectorPagination"></div>
        </div>

        <!-- Right:MappingList -->
        <div class="form-container lg:col-span-2 p-5">
            <div class="border-gray-100 flex items-center justify-end mb-5">
                <button class="btn btn-info" onclick="doLoader('/mapping/pageAdd')" data-permission="mapping:edit">
                    <i class="fa fa-plus"></i>
                    <span>Add Sync</span>
                </button>
            </div>

            <table class="table">
                <thead>
                <tr class="text-left">
                    <th>Name</th>
                    <th>Type</th>
                    <th>Result</th>
                    <th>Status</th>
                    <th>Last Sync</th>
                </tr>
                </thead>
                <tbody id="mappingTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        $(function () {
            // DefinitionsBackFunctions，SonPageNoodles.Back
            window.backIndexPage = function () {
                doLoader('/index');
            };

            // Sync TrendsChart
            const trendCanvas = document.getElementById('trendChart');
            if (!trendCanvas) {
                console.error('TendChart element not found');
            }
            const trendCtx = trendCanvas ? trendCanvas.getContext('2d') : null;
            const trendChart = trendCtx ? new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Synchronization succeeded',
                            data: [],
                            borderColor: '#165DFF',
                            borderWidth: 2,
                            backgroundColor: 'rgba(22, 93, 255, 0.1)',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'Sync failed',
                            data: [],
                            borderColor: '#fa8c16',
                            borderWidth: 2,
                            backgroundColor: 'rgba(250, 140, 22, 0.3)',
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 2.1,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        }
                    },
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    }
                }
            }) : null;

            // TasksStatusminBattery
            const statusDoughnutCanvas = document.getElementById('statusDoughnutChart');
            const statusDoughnutCtx = statusDoughnutCanvas ? statusDoughnutCanvas.getContext('2d') : null;
            const statusDoughnutChart = statusDoughnutCtx ? new Chart(statusDoughnutCtx, {
                type: 'bar',
                data: {
                    labels: ['Overall tasks', 'Running', 'Failed'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: [
                            'rgba(24, 144, 255, 0.45)',   // #1890ff
                            'rgba(82, 196, 26, 0.45)',   // #52c41a
                            'rgba(245, 34, 45, 0.45)'   // #f5222d
                        ],
                        borderWidth: 0,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 1.9,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return context.label + ': ' + context.parsed.x;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            grid: {
                                display: true
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            }) : null;
            const trendConfig = {
                'data': {},
                'type': '7',
                '7': function (data) {
                    if (!data || data.length === 0) {
                        return [];
                    }
                    return data.length > 7 ? data.slice(-7) : data;
                },
                '15': function (data) {
                    if (!data || data.length === 0) {
                        return [];
                    }
                    return data.length > 15 ? data.slice(-15) : data;
                },
                '30': function (data) {
                    return data || [];
                }
            };

            function refreshLineChatData(trend) {
                if (!trendChart) return;
                trendConfig['data'] = trend;
                let strategy = trendConfig[trendConfig.type];
                trendChart.data.labels = strategy(trend.labels);
                trendChart.data.datasets[0].data = strategy(trend.success);
                trendChart.data.datasets[1].data = strategy(trend.fail);
                trendChart.update('none');
            }

            $('.trend-item').unbind('click').bind('click', function () {
                $('.trend-item').removeClass('text-primary');
                $(this).addClass('text-primary');
                trendConfig.type = $(this).data("key");
                refreshLineChatData(trendConfig['data']);
            })

            function renderTotalMeta(r) {
                const isIncrease = r.lastWeekMeta <= r.totalMeta;
                const diff = isIncrease ? (r.totalMeta - r.lastWeekMeta) : (r.lastWeekMeta - r.totalMeta);
                const percent = r.lastWeekMeta > 0 ? (diff / r.lastWeekMeta * 100) : 0;
                const config = isIncrease ? {
                    class: 'fa-arrow-up',
                    text: 'Growth',
                    colorClass: 'text-success'
                } : {
                    class: 'fa-arrow-down',
                    text: 'Lower',
                    colorClass: 'text-warning'
                };
                return `<div class="flex items-center justify-between">
                <p class="text-gray-500">Total number of tasks</p>
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                    <i class="fa fa-tasks"></i>
                </div>
            </div>
            <div class="flex items-end success">
                <span class="text-xxl font-bold">${r.totalMeta}</span>
                <span class="${config.colorClass} text-sm mb-1 flex items-center ml-2">
                    <i class="fa ${config.class} mr-1"></i> ${diff} individual
                </span>
            </div>
            <p class="text-xs text-gray-500 mt-1">More than last week.${config.text} ${percent.toFixed(2)}%</p>`;
            }

            function renderRunningMeta(r) {
                const percent = r.totalMeta > 0 ? (r.runningMeta / r.totalMeta * 100) : 0;
                return `<div class="flex items-center justify-between">
                <p class="text-gray-500">Running Tasks</p>
                <div class="w-10 h-10 rounded-full bg-success/10 flex items-center justify-center text-success">
                    <i class="fa fa-play"></i>
                </div>
            </div>
            <div class="flex items-end">
                <span class="text-xxl font-bold">${r.runningMeta}</span>
                <span class="text-success text-sm mb-1 flex items-center ml-2">
                        <i class="fa fa-check mr-1"></i> Normal
                    </span>
            </div>
            <p class="text-xs text-gray-500 mt-1">Jim.Total number of tasks ${percent.toFixed(2)}%</p>`;
            }

            function renderAllData(r) {
                const total = (r.success || 0) + (r.fail || 0);
                return `<div class="flex items-center justify-between">
                <p class="text-gray-500">Sync Total</p>
                <div class="w-10 h-10 rounded-full bg-info/10 flex items-center justify-center text-info">
                    <i class="fa fa-database"></i>
                </div>
            </div>
            <div class="flex items-end success">
                <span class="text-xxl font-bold">${total}</span>
            </div>`;
            }

            function renderStatistic(r) {
                const statistic = [
                    {key: 'success', title: 'Success', bgColor: 'success'},
                    {key: 'fail', title: 'Failed', bgColor: 'error'},
                    {key: 'insert', title: 'Create', bgColor: 'primary'},
                    {key: 'update', title: 'Edit', bgColor: 'info'},
                    {key: 'delete', title: 'Delete', bgColor: 'warning'},
                    {key: 'ddl', title: 'DDL', bgColor: 'violet'}
                ];

                const html = statistic.map(item => `
                <div class="mini-stat-card mini-stat-card--${item.bgColor}">
                    <div class="mini-stat-info">
                        <p class="mini-stat-title">${item.title}</p>
                    </div>
                    <span class="mini-stat-number text-${item.bgColor}" title="${r[item.key] || 0}">
                        ${r[item.key] || 0}
                    </span>
                </div>
            `).join('');

                $("#statistic").html(html);
            }

            // Refreshdashboard data
            function refreshDashboardData() {
                doGetter("/monitor/dashboard", {}, function (response) {
                    if (response.success === true) {
                        const r = response.data;
                        $("#totalMeta").html(renderTotalMeta(r));
                        $("#runningMeta").html(renderRunningMeta(r));
                        $("#failMeta").text(r.failMeta);
                        $("#allData").html(renderAllData(r));
                        // GenerateMinicard
                        renderStatistic(r);
                        refreshLineChatData(r.trend);

                        // Update column chart data
                        if (statusDoughnutChart) {
                            statusDoughnutChart.data.datasets[0].data = [
                                r.totalMeta || 0,
                                r.runningMeta || 0,
                                r.failMeta || 0
                            ];
                            statusDoughnutChart.update('none');
                        }
                    }
                });
            }

            // InitializeminPageManager
            let searchConnector = new PaginationManager({
                requestUrl: '/connector/search',
                tableBodySelector: '#connectorTable',
                paginationSelector: '#connectorPagination',
                pageSize: 3,
                showBoundaryButtons: false,
                renderRow: function (connector, index) {
                    const url = escapeHtml((connector.config && connector.config.url) || '');
                    const type = escapeHtml((connector.config && connector.config.connectorType) || '');
                    return `<div class="card flex justify-between items-center border rounded-md mb-3">
                <div class="flex items-center min-w-0 flex-1 overflow-hidden">
                    <div class="flex items-center justify-center ml-3 flex-shrink-0">
                        <img draggable="false" class="connector-logo" src="${$basePath}/img/${type}.png" alt="${type}">
                    </div>
                    <div class="ml-3 min-w-0 overflow-hidden">
                        <p class="font-medium text-truncate" title="${escapeHtml(connector.name)}">${escapeHtml(connector.name)}</p>
                        <p class="text-xs text-gray-500 text-truncate" title="${url}">${url}</p>
                    </div>
                </div>
                <div class="flex items-center mr-2 flex-shrink-0">
                    ${Number(connector.status) === 1 ? '<span class="badge badge-success">Online</span>' : '<span class="badge badge-error">Offline</span>'}
                </div>
            </div>`;
                },
                emptyHtml: '<div class="text-center"><i class="fa fa-database empty-icon"></i><p class="empty-text">Other Organiser</p><p class="empty-description">Click Add button to create the first connection</p></div>'
            });

            // InitializeminPageManager
            let searchMapping = new PaginationManager({
                requestUrl: '/mapping/search',
                tableBodySelector: '#mappingTable',
                pageSize: 5,
                showBoundaryButtons: false,
                renderRow: function (mapping, index) {
                    return `<tr>
                    <td><div class="font-medium">${escapeHtml(mapping.name)}</div></td>
                    <td>${renderModelText(mapping && mapping.model)}</td>
                    <td>${renderSyncResult(mapping)}</td>
                    <td>${renderStateText((mapping && mapping.meta && mapping.meta.state) || 0)}</td>
                    <td>${formatRelativeTime((mapping && mapping.meta && mapping.meta.updateTime) || '')}</td>
                </tr>`;
                },
                emptyHtml: '<td colspan="5" class="text-center"><i class="fa fa-exchange empty-icon"></i><p class="empty-text">Synchronising folder</p><p class="empty-description">Click Add button to create the first task</p></td>'
            });

            // Immediately upon initializationRefreshOnce.
            refreshDashboardData();

            // Register to GlobalScheduledRefreshManager
            PageRefreshManager.register(() => {
                refreshDashboardData();
                searchConnector.doSearch({}, searchConnector.currentPage);
                searchMapping.doSearch({}, searchMapping.currentPage);
            });

        });
    </script>
</div>
</html>
