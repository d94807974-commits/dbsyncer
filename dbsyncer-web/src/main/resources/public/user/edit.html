<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Modify User</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="user-btn-submit" class="btn btn-primary">
                <i class="fa fa-save"></i> Save
            </button>
            <button class="btn btn-outline" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> Back
            </button>
        </div>
        <form id="user-form-edit" method="post">
            <div class="grid grid-cols-2">
                <!-- Role：Yes Notably.user:edit It Features.NothenRead-onlyPresentation -->
                <div class="form-item">
                    <label class="form-label">Role</label>
                    <div class="form-control-area">
                        <select id="roleId" class="form-control" name="roleId" th:if="${canAssignRole}" required>
                            <option th:each="r : ${roles}"
                                    th:value="${r.id}"
                                    th:text="${r.name}"
                                    th:selected="${r.id == currentUser?.roleId}"></option>
                        </select>
                        <input class="form-control" type="text" readonly th:unless="${canAssignRole}"
                               th:value="${currentUser?.roleName}"/>
                    </div>
                </div>

                <!-- Account -->
                <div class="form-item">
                    <label class="form-label">Account</label>
                    <div class="form-control-area">
                        <input class="form-control" name="username" type="text" maxlength="50" readonly
                               th:value="${currentUser?.username}"/>
                    </div>
                </div>

                <!-- Nickname -->
                <div class="form-item">
                    <label class="form-label">Nickname<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="nickname" type="text" maxlength="50" required
                               placeholder="Please enter nickname" th:value="${currentUser?.nickname}"/>
                    </div>
                </div>

                <!-- Old password -->
                <div class="form-item">
                    <label class="form-label">Old password</label>
                    <div class="form-control-area">
                        <input class="form-control" name="oldPwd" type="password" maxlength="64"
                               placeholder="If you need to change the password, enter the old password"/>
                    </div>
                </div>

                <!-- New Password -->
                <div class="form-item">
                    <label class="form-label">New Password</label>
                    <div class="form-control-area">
                        <input class="form-control" name="newPwd" type="password" maxlength="64"
                               placeholder="Please enter a new password"/>
                    </div>
                </div>
            </div>
        </form>
        <!-- YesRole dbSelect Draw down to set up heights to avoid being hitform-container DisarmCut. -->
        <div class="blank-block-md" th:if="${canAssignRole}"></div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript">
    const currentUserName = [[${currentUserName}]];

    if ($('#roleId').length) {
        $('#roleId').dbSelect({type: 'single'});
    }

    //Save
    $("#user-btn-submit").on('click', function () {
        const $form = $("#user-form-edit");
        if (!validateForm($form)) {
            return;
        }

        const $btn = $(this);
        const originalText = $btn.html();
        $btn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
        const data = $form.serializeJson();
        doPoster("/user/edit", data, function (response) {
            $btn.html(originalText).prop('disabled', false);
            if (response.success !== true) {
                bootGrowl(response.message || "Modify failed", "danger");
                return;
            }
            // RefreshGiven the individualInfo
            if (currentUserName === data.username) {
                // EditGiven the individualPasswordThen we Procedurally ResetLogin
                if (!isBlank(data.newPwd)) {
                    bootGrowl("Reset password successful. Jump to login in 3 seconds. Page Noodles.", "success");
                    setTimeout(function () {
                        doPoster("/logout", null, function (data) {
                            location.href = $basePath;
                        });
                    }, 3000);
                    return;
                }
                refreshLoginUser();
            }
            bootGrowl("Modified!", "success");
            backIndexPage();
        });
    });
</script>
</html>
