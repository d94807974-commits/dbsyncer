<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center"
            th:text="$acl!=full}? 'Resource authorization': 'Resource authorization'">Resource authorization</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button class="btn btn-outline" type="button" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> Back
            </button>
            <button id="aclSubmitBtn" class="btn btn-primary" type="button" data-permission="acl:edit">
                <i class="fa fa-save"></i> Save
            </button>
        </div>
        <div class="border-t mb-5"></div>

        <form id="acl-form-edit" method="post">
            <input type="hidden" name="id" th:value="${acl?.id}"/>

            <!-- License type -->
            <h4 class="card-title mb-3">License type</h4>
            <div class="form-item mb-3">
                <label class="form-label">Type<strong class="text-primary">*</strong></label>
                <div class="form-control-area">
                    <div id="subjectTypeGroup" class="radio-group radio-group-control-height">
                        <input type="radio" name="subjectType" value="0"
                               th:checked="${acl?.subjectType == 0}"/>
                        <label>User</label>
                        <input type="radio" name="subjectType" value="1"
                               th:checked="${acl == null or acl.subjectType == 1}"/>
                        <label>Role</label>
                    </div>
                </div>
            </div>
            <div class="form-item mb-5">
                <label class="form-label" id="subjectPickLabel">Organisation<strong class="text-primary">*</strong></label>
                <div class="form-control-area">
                    <div id="roleSelectWrap" class="w-320 max-w-full">
                        <select id="subjectRoleId" class="form-control" name="subjectId">
                            <option value="">Please select a role</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r.id}"
                                    th:text="${r.name}"
                                    th:selected="${acl?.subjectType == 1 and acl?.subjectId == r.id}"></option>
                        </select>
                    </div>
                    <div id="userSelectWrap" class="hidden w-320 max-w-full">
                        <select id="subjectUsername" class="form-control" name="username">
                            <option value="">Select User</option>
                            <option th:each="u : ${users}"
                                    th:value="${u.username}"
                                    th:text="${u.nickname + ' (' + u.username + ')'}"
                                    th:selected="${acl?.subjectType == 0 and acl?.subjectId == u.id}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="border-t mb-5"></div>

            <!-- Resource scope -->
            <h4 class="card-title mb-3">Resource scope</h4>
            <p class="text-sm text-tertiary mb-4"
               th:text="$ {acl!=null}? 'Modify the resources and authority corresponding to the current mandate. ' : 'can tick multiple resource types and select more specific resources in the list below; permissions are valid for all selected resources. ♪ I'm sorry ♪">
            </p>
            <div class="form-item mb-4">
                <label class="form-label">Resource type<strong class="text-primary">*</strong></label>
                <div class="form-control-area">
                    <div id="resourceTypeGroup" class="checkbox-group checkbox-group-inline">
                        <input type="checkbox" id="rtype_group" name="resourceTypeItem" value="group"
                               th:checked="${acl == null or acl.resourceType == 'group'}"
                               th:disabled="${acl != null and acl.resourceType != 'group'}"/>
                        <label for="rtype_group">Business group</label>
                        <input type="checkbox" id="rtype_connector" name="resourceTypeItem" value="connector"
                               th:checked="${acl?.resourceType == 'connector'}"
                               th:disabled="${acl != null and acl.resourceType != 'connector'}"/>
                        <label for="rtype_connector">Connect</label>
                        <input type="checkbox" id="rtype_mapping" name="resourceTypeItem" value="mapping"
                               th:checked="${acl?.resourceType == 'mapping'}"
                               th:disabled="${acl != null and acl.resourceType != 'mapping'}"/>
                        <label for="rtype_mapping">Sync task</label>
                        <input type="checkbox" id="rtype_validateSync" name="resourceTypeItem" value="validateSync"
                               th:checked="${acl?.resourceType == 'validateSync'}"
                               th:disabled="${acl != null and acl.resourceType != 'validateSync'}"/>
                        <label for="rtype_validateSync">Data validation</label>
                        <input type="checkbox" id="rtype_databaseSync" name="resourceTypeItem" value="databaseSync"
                               th:checked="${acl?.resourceType == 'databaseSync'}"
                               th:disabled="${acl != null and acl.resourceType != 'databaseSync'}"/>
                        <label for="rtype_databaseSync">Database migration</label>
                    </div>
                </div>
            </div>

            <div id="resourceListPanel" class="mb-5">
                <div id="groupResourceWrap" class="form-item mb-3">
                    <label class="form-label">Business group<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <div class="w-320 max-w-full">
                            <select id="resourceGroupId" class="form-control">
                                <option th:each="g : ${groups}"
                                        th:value="${g.id}"
                                        th:text="${g.name}"
                                        th:selected="${acl?.resourceType == 'group' and acl?.resourceId == g.id}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="connectorResourceWrap" class="form-item mb-3">
                    <label class="form-label">Connect<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <div class="w-320 max-w-full">
                            <select id="resourceConnectorId" class="form-control">
                                <option th:each="c : ${connectors}"
                                        th:value="${c.id}"
                                        th:text="${c.name}"
                                        th:selected="${acl?.resourceType == 'connector' and acl?.resourceId == c.id}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="mappingResourceWrap" class="form-item mb-3">
                    <label class="form-label">Sync task<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <div class="w-320 max-w-full">
                            <select id="resourceMappingId" class="form-control">
                                <option th:each="m : ${mappings}"
                                        th:value="${m.id}"
                                        th:text="${m.name}"
                                        th:selected="${acl?.resourceType == 'mapping' and acl?.resourceId == m.id}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="validateSyncResourceWrap" class="form-item mb-3">
                    <label class="form-label">Data validation<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <div class="w-320 max-w-full">
                            <select id="resourceValidateSyncId" class="form-control">
                                <option th:each="t : ${validateSyncTasks}"
                                        th:value="${t.id}"
                                        th:text="${t.name}"
                                        th:selected="${acl?.resourceType == 'validateSync' and acl?.resourceId == t.id}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="databaseSyncResourceWrap" class="form-item mb-3">
                    <label class="form-label">Database migration<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <div class="w-320 max-w-full">
                            <select id="resourceDatabaseSyncId" class="form-control">
                                <option th:each="t : ${databaseSyncTasks}"
                                        th:value="${t.id}"
                                        th:text="${t.name}"
                                        th:selected="${acl?.resourceType == 'databaseSync' and acl?.resourceId == t.id}"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border-t mb-5"></div>

            <!-- PermissionTranche: Open=Read/Write，Off=Read-only -->
            <h4 class="card-title mb-3">Permission</h4>
            <p class="text-sm text-tertiary mb-4">
                Actes on all resources selected above; closes as read-only (visible) and opens as readable and writing (including editing and start-up).</p>
            <div class="form-item mb-4">
                <label class="form-label">Read/Write</label>
                <div class="form-control-area">
                    <label class="form-switch" title="Open: read-and-write; off: read-only">
                        <input id="aclPermissionSwitch" name="permission" type="checkbox"
                               th:checked="${acl == null or acl.permission == 1}"/>
                        <span class="switch-track">
                            <span class="switch-option switch-option-on">Yes</span>
                            <span class="switch-option switch-option-off">No</span>
                            <span class="switch-thumb"></span>
                        </span>
                    </label>
                </div>
            </div>
        </form>
        <div class="blank-block-md"></div>
    </div>
</div>

<script type="text/javascript" th:inline="javascript">
    $(function () {
        const editMode = [[${acl != null
    }]]
        ;
        const editingUser = [[${acl != null and acl.subjectType == 0
    }]]
        ;
        const initResourceType = /*[[${acl != null and acl.resourceType != null ? acl.resourceType : 'group'}]]*/ 'group';
        const resourceSelectType = editMode ? 'single' : 'multiple';
        const SUBJECT_USER = '0';
        const SUBJECT_ROLE = '1';

        const RESOURCE_META = {
            group: {wrap: '#groupResourceWrap', select: '#resourceGroupId', label: 'Business group'},
            connector: {wrap: '#connectorResourceWrap', select: '#resourceConnectorId', label: 'Connect'},
            mapping: {wrap: '#mappingResourceWrap', select: '#resourceMappingId', label: 'Sync task'},
            validateSync: {wrap: '#validateSyncResourceWrap', select: '#resourceValidateSyncId', label: 'Data validation'},
            databaseSync: {wrap: '#databaseSyncResourceWrap', select: '#resourceDatabaseSyncId', label: 'Database migration'}
        };

        window.backIndexPage = function () {
            doLoader('/acl');
        };

        $('#subjectRoleId').dbSelect({type: 'single'});
        $('#subjectUsername').dbSelect({type: 'single'});
        Object.keys(RESOURCE_META).forEach(function (key) {
            $(RESOURCE_META[key].select).dbSelect({type: resourceSelectType});
        });
        // The container shall be initialized: pressinput Initialization will go.isSingle，onChange Only the current one
        $('#resourceTypeGroup').checkboxGroup({
            theme: 'primary',
            size: 'md',
            layout: 'inline',
            onChange: function (values) {
                syncResourceTypePanel(values);
            }
        });
        initSwitch($('#aclPermissionSwitch'));

        function syncSubjectType(type) {
            const current = String(type == null ? SUBJECT_ROLE : type);
            if (current === SUBJECT_USER) {
                $('#roleSelectWrap').hide();
                $('#userSelectWrap').show();
                $('#subjectPickLabel').html('SelectionUser<strong class="text-primary">*</strong>');
            } else {
                $('#userSelectWrap').hide();
                $('#roleSelectWrap').show();
                $('#subjectPickLabel').html('Organisation<strong class="text-primary">*</strong>');
            }
        }

        function selectedResourceTypes() {
            const types = [];
            $('#resourceTypeGroup input[name="resourceTypeItem"]:checked').each(function () {
                types.push($(this).val());
            });
            return types;
        }

        function readSelectValues($el) {
            // dbSelect Multiple SelectionsStatusIt's inside the component, native.select None multiple Time.val() Only one.
            const api = $el.data('dbSelect');
            if (api && typeof api.getValues === 'function') {
                return (api.getValues() || []).filter(function (v) {
                    return !!v;
                });
            }
            const val = $el.val();
            if (val == null || val === '') {
                return [];
            }
            if (Array.isArray(val)) {
                return val.filter(function (v) {
                    return !!v;
                });
            }
            return [val];
        }

        // form-item Yes.display:grid It'll cover..hidden，Useshow/hide Inline Styles
        function syncResourceTypePanel(values) {
            const types = Array.isArray(values) ? values : selectedResourceTypes();
            Object.keys(RESOURCE_META).forEach(function (key) {
                const $wrap = $(RESOURCE_META[key].wrap);
                if (types.indexOf(key) >= 0) {
                    $wrap.show();
                } else {
                    $wrap.hide();
                }
            });
        }

        $('#subjectTypeGroup').radioGroup({
            theme: 'primary',
            size: 'md',
            onChange: function (value) {
                syncSubjectType(value);
            }
        });
        syncSubjectType(editingUser ? SUBJECT_USER : SUBJECT_ROLE);

        if (editMode) {
            $('#resourceTypeGroup input[name="resourceTypeItem"]').each(function () {
                const $input = $(this);
                const checked = $input.val() === initResourceType;
                $input.prop('checked', checked).prop('disabled', !checked);
                $input.closest('.checkbox-group-item').toggleClass('active', checked).toggleClass('disabled', !checked);
            });
        }
        // InitialAllHide, then tick, avoid not tickingTypeResidual visible
        Object.keys(RESOURCE_META).forEach(function (key) {
            $(RESOURCE_META[key].wrap).hide();
        });
        syncResourceTypePanel();

        $('#aclSubmitBtn').on('click', function () {
            const subjectType = String($('#subjectTypeGroup input[name="subjectType"]:checked').val() || SUBJECT_ROLE);
            if (subjectType === SUBJECT_ROLE && !$('#subjectRoleId').val()) {
                bootGrowl('Please select a role', 'warning');
                return;
            }
            if (subjectType === SUBJECT_USER && !$('#subjectUsername').val()) {
                bootGrowl('Select User', 'warning');
                return;
            }
            const types = selectedResourceTypes();
            if (!types.length) {
                bootGrowl('Select the resource type', 'warning');
                return;
            }
            const segments = [];
            let total = 0;
            types.forEach(function (type) {
                const meta = RESOURCE_META[type];
                const ids = readSelectValues($(meta.select));
                if (ids.length) {
                    segments.push(type + ':' + ids.join(','));
                    total += ids.length;
                }
            });
            if (!total) {
                bootGrowl('Select Resources', 'warning');
                return;
            }
            const data = {
                id: $('#acl-form-edit').find('input[name="id"]').val(),
                subjectType: subjectType,
                subjectId: subjectType === SUBJECT_ROLE ? $('#subjectRoleId').val() : '',
                username: subjectType === SUBJECT_USER ? $('#subjectUsername').val() : '',
                permission: $('#aclPermissionSwitch').is(':checked') ? '1' : '0'
            };
            if (editMode) {
                data.resourceType = types[0];
                data.resourceIds = readSelectValues($(RESOURCE_META[types[0]].select)).join(',');
                data.resourceId = data.resourceIds.split(',')[0] || '';
            } else {
                data.resourcePayload = segments.join('|');
            }

            const $btn = $(this);
            const originalText = $btn.html();
            $btn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
            doPoster('/acl/save', data, function (response) {
                $btn.html(originalText).prop('disabled', false);
                if (response.success !== true) {
                    bootGrowl(response.message || 'Save failed', 'danger');
                    return;
                }
                const tip = (typeof response.data === 'string' && response.data) ? response.data : 'Saved!';
                bootGrowl(tip, 'success');
                backIndexPage();
            });
        });
    });
</script>
</html>
