<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Add Connection</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="connectorSubmitBtn" type="button" class="btn btn-primary">
                <i class="fa fa-save"></i> Save
            </button>
            <button class="btn btn-outline" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> Back
            </button>
        </div>

        <form id="connectorAddForm" class="grid">
            <div class="grid grid-cols-2 mt-4">
                <div class="form-item">
                    <label class="form-label">Type</label>
                    <div class="form-control-area">
                        <select id="connectorType" name="connectorType" class="form-control">
                            <option th:each="t,s:${connectorTypes}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Name<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <input class="form-control" name="name" type="text" maxlength="50" required placeholder="Please enter connection name"/>
                    </div>
                </div>
            </div>
            <div id="connectorConfig" class="mb-5"></div>
            <div class="grid grid-cols-2 mt-4">
                <div class="form-item">
                    <label class="form-label">Source</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="isSource" type="checkbox" checked/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-item">
                    <label class="form-label">Target</label>
                    <div class="form-control-area">
                        <label class="form-switch">
                            <input name="isTarget" type="checkbox" checked/>
                            <span class="switch-track">
                                <span class="switch-option switch-option-on">Yes</span>
                                <span class="switch-option switch-option-off">No</span>
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </form>

    </div>
</div>

<script>
$(document).ready(function() {
    function changeConfig(selectedValues) {
        // InitializeFinish, if selected by defaultValue，Trigger LoadConfigure
        if (selectedValues && selectedValues.length > 0) {
            const selectedValue = selectedValues[0];
            const $connectorConfig = $("#connectorConfig");
            $connectorConfig.html('<div class="loading"><div class="loading-spinner"></div>Loading...</div>');
            $connectorConfig.load($basePath + "/connector/page/add" + selectedValue, function (response, status) {
                if (status !== 'success') {
                    $connectorConfig.html('<div class="empty"><div class="empty-icon"><i class="fa fa-warning"></i></div><div class="empty-text">Loading connection failed</div></div>');
                }
            });
        }
    }
    $('#connectorType').dbSelect({
        type: 'single',
        onSelect: changeConfig,
        onReady: changeConfig
    });

    // TieSavebuttonEvent
    $('#connectorSubmitBtn').off('click').on('click', function () {
        const $form = $("#connectorAddForm");
        const isSource = $form.find('input[name="isSource"]').is(':checked');
        const isTarget = $form.find('input[name="isTarget"]').is(':checked');
        if (!isSource && !isTarget) {
            bootGrowl("At least open as a source or as a target.", "warning");
            return;
        }
        // Authentication Form
        if (validateForm($form)) {
            // ShowSubmitStatus
            const submitBtn = $(this);
            const originalText = submitBtn.html();
            submitBtn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
            doPoster("/connector/add", $form.serializeJson(), function (response) {
                submitBtn.html(originalText).prop('disabled', false);
                if (response.success === true) {
                    bootGrowl("Saved successfully!", "success");
                    backIndexPage();
                } else {
                    bootGrowl(response.message, "danger");
                }
            });
        }
    });
})
</script>

</html>
