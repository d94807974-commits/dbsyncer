<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- SearchConnectorList -->
<div class="form-container">
    <div class="card-header">
 <h3 class="card-title text-center">Connections</h3>
    </div>
    <div class="card-body">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <div id="searchConnector" class="search-wrapper w-320 max-w-full flex-shrink-0">
                    <i class="fa fa-search search-icon"></i>
 <input class="search-input" type="text" maxlength="32" placeholder="Search by connection name">
 <span class="search-clear" title="Clear">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
                <div id="connectorGroupToolbar" class="flex items-center gap-2"></div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <span id="connectorGroupCreateHost" data-permission="connector:edit"></span>
                <button id="connectorAddBtn" class="btn btn-primary" type="button" data-permission="connector:edit">
 <i class="fa fa-plus"></i> Add
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th></th>
 <th>Name</th>
 <th>Type</th>
 <th>Address</th>
 <th>Status</th>
 <th>Actions</th>
            </tr>
            </thead>
            <tbody id="connectorTableBody"></tbody>
        </table>
        <div class="blank-block"></div>

    </div>
</div>

<script>
// Page Initialization
$(document).ready(function() {
 // DefinitionsBackFunctions，SubpageBack
    window.backIndexPage = function () {
        doLoader('/connector/list');
    };

    let groupToolbar = null;
 // Initializing Page Break Manager
    const pagination = new PaginationManager({
        requestUrl: '/connector/search',
        tableBodySelector: '#connectorTableBody',
        params: {groupId: (window.GroupToolbar && GroupToolbar.peekStoredGroupId('connector')) || ''},
        refreshCompleted: function () {
            if (groupToolbar) {
                groupToolbar.setListTotal(pagination.total || 0);
            }
            if (window.DBSPermission) {
                DBSPermission.apply('#mainContent');
            }
        },
        renderRow: function(connector, index) {
            const canEdit = !window.DBSPermission || DBSPermission.has('connector:edit');
            const editBtn = canEdit ? `
 <button class="table-action-btn view" title="Update" onclick="doLoader('/connector/page/edit?id=${connector.id}')">
                                <i class="fa fa-edit"></i>
                            </button>` : '';
            const copyBtn = canEdit ? `
 <button class="table-action-btn copy" title="Copy" onclick="copyConnector('${connector.id}')">
                                <i class="fa fa-copy"></i>
                            </button>` : '';
            const deleteBtn = canEdit ? `
 <button class="table-action-btn delete" title="Delete" onclick="deleteConnector('${connector.id}')">
                                <i class="fa fa-trash"></i>
                            </button>` : '';
            return `
                <tr>
                    <td>${index}</td>
                    <td>
                        <span>${escapeHtml(connector.name)}</span>
                    </td>
                    <td><img draggable="false" src="${$basePath}/img/${escapeHtml(connector.config.connectorType || '')}.png" style="width: 50px; height: 50px;"></td>
                    <td title="${escapeHtml(connector.config.url || '')}">${escapeHtml(connector.config.url || '')}</td>
 <td>${Number(connector.status) === 1 ? '<span class="badge badge-success">Online</span>' : '<span class="badge badge-error">Offline</span>'}</td>
                    <td>
                        <div class="flex items-center">
                            ${editBtn}
 <button class="table-action-btn play" title="Test" onclick="testConnector('${connector.id}')">
                                <i class="fa fa-flash"></i>
                            </button>
                            ${copyBtn}
                            ${deleteBtn}
                        </div>
                    </td>
                </tr>
            `;
        },
 emptyHtml:'<td colspan="5" class="text-center"><i class="fa fa-database empty-icon"></i><p class="empty-text">No connections yet</p><p class="empty-description">Click Add to create your first connection</p></td>',
        customPageSize:true
    });

    let searchInput = null;
    groupToolbar = GroupToolbar.initListToolbar({
        containerSelector: '#connectorGroupToolbar',
        createButtonHostSelector: '#connectorGroupCreateHost',
        resourceType: 'connector',
        searchUrl: '/connector/search',
        addPageUrl: '/connector/page/add',
        addButtonSelector: '#connectorAddBtn',
        onChange: function () {
            pagination.doSearch(groupToolbar.getSearchParams({ searchKey: searchInput ? searchInput.getValue() : '' }), 1);
        }
    });
    groupToolbar.setListTotal(pagination.total || 0);

 // SearchBox Input Event
    searchInput = initSearch('searchConnector', function (searchKey) {
        pagination.doSearch(groupToolbar.getSearchParams({ searchKey: searchKey }));
    });

 // Register to Global TimeRefreshManager
    PageRefreshManager.register(() => {
        pagination.doSearch(groupToolbar.getSearchParams({ searchKey: searchInput.getValue() }), pagination.currentPage);
    });

});

// CopyConnections
function copyConnector(id) {
    doPoster("/connector/copy", { id: id }, function (response) {
        if (response.success) {
 bootGrowl('CopySuccess', 'success');
            backIndexPage();
        } else {
 bootGrowl('CopyFailed: ' + response.message, 'danger');
        }
    });
}

// TestConnections
function testConnector(id) {
 // Show LoadingStatus
    const btn = event.target.closest('.table-action-btn');
    const originalText = btn.innerHTML;
 btn.innerHTML = '<i class="fa fa-spinner fa-spin" title="Testing 179"></i>';
    btn.disabled = true;
    doPoster("/connector/test", { id: id }, function (response) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        if (response.success) {
 bootGrowl('TestSuccess', 'success');
        } else {
 bootGrowl('TestFailed: ' + response.message, 'danger');
        }
    });
}

// DeleteConnections
function deleteConnector(id) {
    showConfirm({
 title: 'OKYes.DeleteConnections？',
        icon: 'warning',
        size: 'large',
        confirmType: 'danger',
        onConfirm: function() {
            doPoster("/connector/remove", { id: id }, function (response) {
                if (response.success) {
 bootGrowl('Deleted successfully', 'success');
                    backIndexPage();
                } else {
 bootGrowl('DeleteFailed: ' + response.message, 'danger');
                }
            });
        }
    });
}
</script>

</html>
