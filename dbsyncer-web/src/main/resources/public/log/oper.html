<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Operation logs</h3>
    </div>
    <div class="card-body">
        <div class="form-filter">
            <div class="form-item">
                <label class="form-label" for="filterKeyword">Keyword</label>
                <div class="form-control-area">
                    <input id="filterKeyword" type="text" class="form-control" maxlength="100" placeholder="Operation info"/>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterUsername">Account</label>
                <div class="form-control-area">
                    <input id="filterUsername" type="text" class="form-control" maxlength="50" placeholder="Operator"/>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterIp">IP</label>
                <div class="form-control-area">
                    <input id="filterIp" type="text" class="form-control" maxlength="64" placeholder="Operation Address"/>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterModule">Module</label>
                <div class="form-control-area min-w-300">
                    <select id="filterModule" class="form-control">
                        <option value="" selected>All</option>
                        <option th:each="m : ${logModules}" th:value="${m}" th:text="${m}"></option>
                    </select>
                </div>
            </div>
            <div class="form-item">
                <label class="form-label" for="filterStatus">Status</label>
                <div class="form-control-area">
                    <select id="filterStatus" class="form-control">
                        <option value="-1" selected>All</option>
                        <option value="1">Success</option>
                        <option value="0">Failed</option>
                    </select>
                </div>
            </div>
            <div class="form-item form-item-time">
                <label class="form-label" for="filterBeginTime">Start time</label>
                <div class="form-control-area">
                    <input id="filterBeginTime" type="date" class="form-control"/>
                </div>
            </div>
            <div class="form-item form-item-time">
                <label class="form-label" for="filterEndTime">End Time</label>
                <div class="form-control-area">
                    <input id="filterEndTime" type="date" class="form-control"/>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" id="resetBtn" class="btn btn-outline">Reset</button>
                <button type="button" id="clearBtn" class="btn btn-outline" data-permission="system:edit">Empty Log</button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>Module</th>
                <th>Operation info</th>
                <th>Operator</th>
                <th>IP</th>
                <th>Status</th>
                <th>Time</th>
                <th>Details</th>
            </tr>
            </thead>
            <tbody id="operLogList"></tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/log/oper.js}"></script>
</html>
