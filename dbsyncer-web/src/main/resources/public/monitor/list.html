<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Charts andTaskList -->
<div class="grid grid-cols-1 lg:grid-cols-3 mb-5">
    <!-- Left:TPS / CPU / Memory -->
    <div class="lg:col-span-2">
        <div class="card mb-6">
            <div class="card-header">
                <h3 class="card-title text-center" id="tps">Executor TPS</h3>
            </div>
            <div class="card-body">
                <canvas id="tpsChart" height="200"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title text-center">CPU(%)</h3>
                </div>
                <div class="card-body">
                    <canvas id="cpuChart" height="200"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title text-center">Memory (MB)</h3>
                </div>
                <div class="card-body">
                    <canvas id="memoryChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Right: SystemStatus -->
    <div class="container-no-bg">
        <!-- C Produce Use -->
        <div class="progress-card mb-3" id="cpuProgressBar"></div>

        <!-- Memory UsageRate -->
        <div class="progress-card mb-3" id="memoryProgressBar"></div>

        <!-- DiskUsage -->
        <div class="progress-card mb-3" id="diskProgressBar"></div>

        <!-- ApplyStatus -->
        <div class="mb-3">
            <table class="table">
                <tbody id="metrics"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="grid grid-cols-2 mb-5">
    <!-- Query ExecutorTask -->
    <div class="form-container">
        <div class="card-header">
            <div class="grid grid-cols-6 items-center">
                <div class="lg:col-span-3">
                    <select id="searchActuatorMeta" class="form-control"></select>
                </div>
                <!-- CommunityPressTable nameSearch；Commercial version is fixed conduit(channel)，Do Not DisplayTable nameSearch -->
                <div th:if="${editionInfo == null or editionInfo.edition eq 'community'}"
                     id="searchActuator" class="lg:col-span-3 search-wrapper">
                    <i class="fa fa-search search-icon"></i>
                    <input class="search-input" type="text" maxlength="32" placeholder="Search Table Key" />
                    <span class="search-clear" title="Clear">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th></th>
                    <th>Sync task</th>
                    <th>Result</th>
                </tr>
                </thead>
                <tbody id="actuatorList"></tbody>
            </table>
        </div>
    </div>

    <!-- Backlog / EnduringTrends -->
    <div class="grid grid-cols-1">
        <div class="form-container">
            <div class="card-header">
                <h3 class="card-title text-center">Stacking Trends</h3>
            </div>
            <div class="card-body">
                <canvas id="queueChart" height="160"></canvas>
            </div>
        </div>
        <div class="form-container">
            <div class="card-header">
                <h3 class="card-title text-center">Durable trend map</h3>
            </div>
            <div class="card-body">
                <canvas id="storageChart" height="160"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/monitor/monitor.js}"></script>
</html>
