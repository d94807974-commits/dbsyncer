<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- FigureTableand MagistracyList -->
<div class="grid grid-cols-1 lg:grid-cols-3 mb-5">
 <!-- Left：TPS / CPU / Memory -->
    <div class="lg:col-span-2">
        <div class="card mb-6">
            <div class="card-header">
 <h3 class="card-title text-center" id="tps">ExecutorTPS</h3>
            </div>
            <div class="card-body">
                <canvas id="tpsChart" height="200"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title text-center">CPU(%)</h3>
                </div>
                <div class="card-body">
                    <canvas id="cpuChart" height="200"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
 <h3 class="card-title text-center">Memory(MB)</h3>
                </div>
                <div class="card-body">
                    <canvas id="memoryChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

 <!-- Right：SystemStatus -->
    <div class="container-no-bg">
 <!-- CPUUsage -->
        <div class="progress-card mb-3" id="cpuProgressBar"></div>

 <!-- There's a chance that you'll be able to make a difference. -->
        <div class="progress-card mb-3" id="memoryProgressBar"></div>

 <!-- Disk Usage -->
        <div class="progress-card mb-3" id="diskProgressBar"></div>

 <!-- ApplyStatus -->
        <div class="mb-3">
            <table class="table">
                <tbody id="metrics"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="grid grid-cols-2 mb-5">
 <!-- SearchExecutor Task -->
    <div class="form-container">
        <div class="card-header">
            <div class="grid grid-cols-6 items-center">
                <div class="lg:col-span-3">
                    <select id="searchActuatorMeta" class="form-control"></select>
                </div>
 <!-- CommunityPressTableFirst NameSearch；Commercial version is fixed conduit(channel)，Do Not DisplayTableFirst NameSearch -->
                <div th:if="${editionInfo == null or editionInfo.edition eq 'community'}"
                     id="searchActuator" class="lg:col-span-3 search-wrapper">
                    <i class="fa fa-search search-icon"></i>
 <input class="search-input" type="text" maxlength="32" placeholder="SearchTableKeyword" />
 <span class="search-clear" title="Clear">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th></th>
 <th>Sync Tasks</th>
 <th>Result</th>
                </tr>
                </thead>
                <tbody id="actuatorList"></tbody>
            </table>
        </div>
    </div>

 <!-- Stack / Enduring trends -->
    <div class="grid grid-cols-1">
        <div class="form-container">
            <div class="card-header">
 <h3 class="card-title text-center">Stacking trend salute</h3>
            </div>
            <div class="card-body">
                <canvas id="queueChart" height="160"></canvas>
            </div>
        </div>
        <div class="form-container">
            <div class="card-header">
 <h3 class="card-title text-center">Durable trend map</h3>
            </div>
            <div class="card-body">
                <canvas id="storageChart" height="160"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/monitor/monitor.js}"></script>
</html>
