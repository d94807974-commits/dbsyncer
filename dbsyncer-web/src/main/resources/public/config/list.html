<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Configuration Management</h3>
    </div>
    <div class="card-body">
        <div class="grid grid-cols-2 lg:grid-cols-2">
            <!-- Left:Configure List -->
            <div class="container-no-bg">
                <h3 class="card-title">Configure List</h3>
                <p class="text-xs text-tertiary">Export all configurations, click
                    <a href="javascript:void(0);" onclick="downLoad()" class="text-primary hover-underline"
                       th:title="'Provisional Size About '+ ${#numbers.formatDecimal((fileSize / 1024), 0, 2)}+ 'KB(ZIP smaller)'">
                        <i class="fa fa-download"></i> Download
                    </a>
                </p>
                <table class="table">
                    <thead>
                    <tr>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Updated at</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${config == null or config.isEmpty()}">
                        <td colspan="5" class="text-center text-tertiary py-8">No configuration data available</td>
                    </tr>
                    <tr th:id="${c?.name}" th:each="c : ${config}">
                        <td><span class="badge badge-primary" th:text="${c?.type}"></span></td>
                        <td><span class="font-medium" th:text="${c?.name}"></span></td>
                        <td><span class="text-sm text-secondary" th:text="${#dates.format(c?.updateTime, 'yyyy-MM-dd HH:mm:ss')}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Right:UploadConfig -->
            <div id="configUploader" class="upload-container">
                <div class="upload-area" data-upload-area>
                    <div class="upload-icon">
                        <i class="fa fa-cloud-upload"></i>
                    </div>
                    <div class="upload-text">Production</div>
                    <div class="upload-hint">
                        Support extended name: .zip<br>
                        Upload up to 5 files once
                    </div>
                    <div class="upload-button">Choose file</div>
                    <input type="file"
                           class="upload-input"
                           id="fileConfig"
                           accept=".zip,application/zip"
                           multiple>
                </div>
                <div class="upload-list" data-upload-list></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
$(function() {
    initFileUpload('#configUploader', {
        uploadUrl: $basePath + '/config/upload',
        accept: ['.zip'],
        maxFiles: 5,
        maxSize: 50 * 1024 * 1024, // 50MB
        onSuccess: function(file, response) {
            if (response.success) {
                notify({ message: 'Upload successful!', type: 'success' });
                doLoader("/config");
            } else {
                notify({ message: response.message || 'Upload failed', type: 'danger' });
            }
        },
        onError: function(file, error) {
            notify({ message: error || 'Upload failed', type: 'danger' });
        }
    });
});

function downLoad() {
    window.open($basePath + "/config/download");
}
</script>
</html>
