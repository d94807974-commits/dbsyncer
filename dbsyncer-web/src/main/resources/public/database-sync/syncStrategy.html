<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Top tab inline:andSourceConnectorThe same.Okay. -->
<div th:fragment="bar">
    <div class="ds-strategy-checks">
        <div>
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group">
                <input type="checkbox" name="enableCopySchema" id="dbSyncEnableCopySchema"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteSchema"
                       th:checked="${task == null ? true : task.enableCopySchema}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopySchema">Copy table schema</label>
            </div>
            <div>
                <span>Overwrite Structure</span>
                <label class="form-switch">
                    <input name="overwriteSchema" type="checkbox" value="true"
                           th:checked="${task?.overwriteSchema}"
                           th:disabled="${readOnly}"/>
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
                <span title="Enabling overwrite schema will drop existing tables in the target database">
                    <i class="fa fa-info-circle"></i> Enabling overwrite schema will drop existing tables in the target database
                </span>
            </div>
        </div>
        <div>
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group">
                <input type="checkbox" name="enableCopyData" id="dbSyncEnableCopyData"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteData"
                       th:checked="${task == null ? true : task.enableCopyData}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopyData">Sync data</label>
            </div>
            <div>
                <span>Overwrite Data</span>
                <label class="form-switch">
                    <input name="overwriteData" type="checkbox" value="true"
                           th:checked="${task?.overwriteData}"
                           th:disabled="${readOnly}"/>
                    <span class="switch-track">
                        <span class="switch-option switch-option-on">Yes</span>
                        <span class="switch-option switch-option-off">No</span>
                        <span class="switch-thumb"></span>
                    </span>
                </label>
            </div>
        </div>
    </div>
</div>

<div th:fragment="content" >
    <h4 class="mb-3 font-medium">
        <i class="fa fa-cogs text-primary"></i> Migration policy
    </h4>
    <div class="grid grid-cols-2 gap-4">
        <!-- Copy table schema -->
        <div class="flex items-center gap-6 flex-wrap">
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group mb-0">
                <input type="checkbox" name="enableCopySchema" id="dbSyncEnableCopySchemaContent"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteSchema"
                       th:checked="${task?.enableCopySchema}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopySchemaContent">Copy table schema</label>
            </div>
            <div class="form-item mb-0">
                <label class="form-label">
                    Overwrite?
                    <i class="fa fa-question-circle text-tertiary" title="Turn on the overlay structure and remove the already existing table of the target"></i>
                </label>
                <div class="form-control-area">
                    <label class="form-switch">
                        <input name="overwriteSchema" type="checkbox" value="true"
                               th:checked="${task?.overwriteSchema}"
                               th:disabled="${readOnly}"/>
                        <span class="switch-track">
                            <span class="switch-option switch-option-on">Yes</span>
                            <span class="switch-option switch-option-off">No</span>
                            <span class="switch-thumb"></span>
                        </span>
                    </label>
                </div>
            </div>
        </div>
        <!-- Data -->
        <div class="flex items-center gap-6 flex-wrap">
            <div class="checkbox-group checkbox-group-inline ds-strategy-enable-group mb-0">
                <input type="checkbox" name="enableCopyData" id="dbSyncEnableCopyDataContent"
                       class="db-sync-strategy-enable" value="true"
                       data-overwrite="overwriteData"
                       th:checked="${task?.enableCopyData}"
                       th:disabled="${readOnly}"/>
                <label for="dbSyncEnableCopyDataContent">Sync data</label>
            </div>
            <div class="form-item mb-0">
                <label class="form-label">
                    Overwrite?
                    <i class="fa fa-question-circle text-tertiary" title="Whether to overwrite the target table when data already exists"></i>
                </label>
                <div class="form-control-area">
                    <label class="form-switch">
                        <input name="overwriteData" type="checkbox" value="true"
                               th:checked="${task?.overwriteData}"
                               th:disabled="${readOnly}"/>
                        <span class="switch-track">
                            <span class="switch-option switch-option-on">Yes</span>
                            <span class="switch-option switch-option-off">No</span>
                            <span class="switch-thumb"></span>
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
