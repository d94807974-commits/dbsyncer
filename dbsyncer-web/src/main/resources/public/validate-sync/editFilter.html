<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <!-- Filter ConditionsTitle-->
    <p><i class="fa fa-filter text-success"></i> Filter Conditions</p>

    <!-- First line:Composite、Source table fields、Condition -->
    <div class="grid grid-cols-3">
        <!-- Composite -->
        <div class="form-item">
            <label class="form-label">Composite
                <i class="fa fa-question-circle text-tertiary" title="SQL is mutually exclusive with AND/OR. Switching to SQL will clear current conditions, and vice versa."></i>
            </label>
            <div class="form-control-area">
                <select id="conditionOperation" class="form-control">
                    <!-- GlobalPageNoodles.-->
                    <option th:if="${tableGroup} == null" th:each="o,s:${condition?.operation}" 
                            th:value="${o?.name}" th:text="${o?.name}" th:title="${o?.message}" 
                            th:selected="${task?.filter.size() gt 0 and task?.filter[0].operation eq 'sql'}"/>
                    <!-- Map relationPageNoodles.-->
                    <option th:if="${tableGroup} != null" th:each="o,s:${condition?.operation}" 
                            th:value="${o?.name}" th:text="${o?.name}" th:title="${o?.message}" 
                            th:selected="${tableGroup?.filter.size() gt 0 and tableGroup?.filter[0].operation eq 'sql'}"/>
                </select>
            </div>
        </div>

        <!-- Source table fields -->
        <div class="form-item">
            <label class="form-label">Source table fields</label>
            <div class="form-control-area">
                <select id="conditionSourceField" class="form-control">
                    <!-- Source tableMaleTotalField -->
                    <option th:if="${tableGroup} == null" th:each="c,s:${task?.sourceColumn}"
                            th:value="${c?.name}" th:text="${c?.name} +' (' + ${c?.typeName} +')'" />
                    <!-- Source table fields -->
                    <option th:each="c,s:${tableGroup?.sourceTable?.column}" 
                            th:value="${c?.name}" th:text="${c?.name} +' (' + ${c?.typeName} +')'" />
                </select>
            </div>
        </div>

        <!-- Condition -->
        <div class="form-item">
            <label class="form-label">Condition</label>
            <select id="conditionFilter" class="form-control">
                <option th:each="f,s:${condition?.filter}" th:value="${f?.name}" th:text="${f?.name}" />
            </select>
        </div>
    </div>

    <!-- I -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  - , -  -  -  -  -  -  -  -  -  - Parameter、System Parameters、Addbutton-->
    <div class="grid grid-cols-3 mt-4">
        <!-- Parameter -->
        <div class="form-item">
            <label class="form-label">Parameter</label>
            <input id="conditionArg" class="form-control" placeholder="Please enter parameter" />
        </div>

        <!-- System Parameters -->
        <div class="form-item">
            <label class="form-label">System Parameters</label>
            <select id="systemArg" class="form-control">
                <option value="" selected="selected">None</option>
                <option th:each="f,s:${condition?.quartzFilter}" th:value="${f?.type}" th:text="${f?.type}" />
            </select>
        </div>

        <!-- Addbutton-->
        <div class="flex items-center justify-end">
            <button id="conditionAdd" type="button" class="btn btn-info">
                <i class="fa fa-plus"></i> Add
            </button>
        </div>
    </div>

    <!-- ConditionListTable 134. -->
    <table id="conditionTable" class="table">
        <thead>
            <tr>
                <th>Composite</th>
                <th>Source table fields</th>
                <th>Condition</th>
                <th>Parameter</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="conditionList">
            <!-- Mapping filter -->
            <tr th:if="${tableGroup} == null" th:each="f,s:${task?.filter}">
                <td>
                    [[${f?.operation}]]
                </td>
                <td>[[${f?.name}]]</td>
                <td>
                    [[${f?.filter}]]
                </td>
                <td>[[${f?.value}]]</td>
                <td>
                    <button class='table-action-btn delete conditionDelete' title="Delete">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
            <!-- TableGroup filter -->
            <tr th:each="f,s:${tableGroup?.filter}">
                <td>
                    [[${f?.operation}]]
                </td>
                <td>[[${f?.name}]]</td>
                <td>
                    [[${f?.filter}]]
                </td>
                <td>[[${f?.value}]]</td>
                <td>
                    <button class='table-action-btn delete conditionDelete' title="Delete">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Hide FormsValue -->
    <div class="hidden">
        <input id="filter" name="filter" class="form-control" type="text"/>
    </div>

<script>
    // InitializeMappingParameter
    function initFilterParams(){
        // GenerateJSONParameter
        const row = [];
        const $conditionList = $("#conditionList");
        $conditionList.find("tr").each(function(k,v){
            const opt = $(this).find("td:eq(0)").text().trim();
            const sf = $(this).find("td:eq(1)").text().trim();
            const filter = $(this).find("td:eq(2)").text().trim();
            const arg = $(this).find("td:eq(3)").text().trim();
            row.push({
               "name": sf,
               "operation": opt,
               "filter": filter,
               "value": arg
             });
        });
        $("#conditionTable").toggleClass("hidden", row.length <= 0);
        $("#filter").val(JSON.stringify(row));
    }

    // TieCreateConditionClickEvent
    function bindFilterAdd() {
        $("#conditionAdd").unbind("click").bind('click', function () {
            const conditionOperation = $("#conditionOperation").val();
            let conditionSourceField = $("#conditionSourceField").val();
            let conditionFilter = $("#conditionFilter").val();
            let $conditionArg = $("#conditionArg");
            const conditionArg = $conditionArg.val();
            const $conditionList = $("#conditionList");
            // CustomSQL
            if (conditionOperation === 'sql') {
                if (isBlank(conditionArg)) {
                    bootGrowl("Parameters cannot be empty.", "danger");
                    return;
                }
                $conditionList.html('');
                conditionSourceField = '';
                conditionFilter = '';
            }
            // Non 159
            else {
                if (isBlank(conditionSourceField)) {
                    bootGrowl("Data source table fields are not empty.", "danger");
                    return;
                }
                // and orandsqlWe need to clean up.sqlTypeYes.Condition
                $conditionList.find("tr").each(function() {
                    const opr = $(this).find("td:eq(0)").text().trim();
                    if (opr === 'sql') {
                        $(this).remove();
                    }
                });
            }

            // Check RepeatField
            let repeated = false;
            $conditionList.find("tr").each(function (k, v) {
                const opr = $(this).find("td:eq(0)").text();
                const sf = $(this).find("td:eq(1)").text();
                const filter = $(this).find("td:eq(2)").text();
                const arg = $(this).find("td:eq(3)").text();
                if (opr === conditionOperation && sf === conditionSourceField && filter === conditionFilter && arg === conditionArg) {
                    repeated = true;
                    return false;
                }
            });
            if (repeated) {
                bootGrowl("Filter condition already exists.", "danger");
                return;
            }

            $conditionList.append(`<tr>
                <td>${conditionOperation}</td>
                <td>${conditionSourceField}</td>
                <td>${conditionFilter}</td>
                <td>${conditionArg}</td>
                <td>
                    <button class="table-action-btn delete conditionDelete" title="Delete"">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>`);
            // ClearParameter
            $conditionArg.val("");
            bindFilterListDelete();
        });
    }

    // Tie Table ClickDeleteEvent
    function bindFilterListDelete(){
        $(".conditionDelete").unbind("click").bind('click', function(){
            // StoptrTriggerclickEvent
            event.cancelBubble=true;
            $(this).closest('tr').remove();
            initFilterParams();
        });
        initFilterParams();
    }

    $(document).ready(function() {
        initSelect($('#conditionOperation'));
        initSelect($('#conditionSourceField'));
        initSelect($('#conditionFilter'));
        $('#systemArg').dbSelect({
            type: 'single',
            onSelect: function (values) {
                const selectedValue = values && values.length > 0 ? values[0] : '';
                if (!isBlank(selectedValue)) {
                    const $tmpVal = $("#conditionArg");
                    $tmpVal.val($tmpVal.val() + selectedValue);
                }
            }
        });

        bindFilterAdd();
        bindFilterListDelete();
    });
</script>
</div>

</html>
