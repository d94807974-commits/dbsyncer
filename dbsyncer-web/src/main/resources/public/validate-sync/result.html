<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Mandate performanceDetails -->
<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Mandate performance</h3>
    </div>
    <div class="card-body">
        <!-- Task InformationCut.Snippets -->
        <div class="dbsyncer-card" style="margin-bottom: 24px;">
            <div class="dbsyncer-card-header" style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);">
                <h3 class="dbsyncer-card-title">
                    <i class="fa fa-info-circle" style="color: var(--primary-color); margin-right: 8px;"></i>
                    Task Information
                </h3>
            </div>
            <div class="dbsyncer-card-body" style="padding: 20px;">
                <div class="grid grid-cols-2">
                    <div class="flex items-center">
                        <label class="font-medium text-gray-600" style="width: 120px;">Other Organiser</label>
                        <span id="taskName" class="text-gray-800">-</span>
                    </div>
                    <div class="flex items-center">
                        <label class="font-medium text-gray-600" style="width: 120px;">Task ID:</label>
                        <span id="taskIdDisplay" class="text-gray-500 text-sm" th:text="${taskId}">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ActionsbuttonSector-->
        <div class="flex items-center justify-between mb-4">
            <button id="backToListBtn" class="btn btn-outline">
                <i class="fa fa-reply"></i> Back to list
            </button>
            <button id="refreshResultBtn" class="btn btn-primary">
                <i class="fa fa-refresh"></i> Refresh
            </button>
        </div>

        <!-- ResultListTable 134. -->
        <table class="table">
            <thead>
            <tr>
                <th style="width: 60px;">No.</th>
                <th style="width: 200px;">Source table</th>
                <th style="width: 200px;">Target table</th>
                <th>Implementation results</th>
                <th style="width: 180px;">Updated At</th>
            </tr>
            </thead>
            <tbody id="resultTableBody">
            <!-- Data will be adoptedJavaScript DynamicShit.Load -->
            </tbody>
        </table>

        <!-- minPageInfo -->
        <div id="resultPagination" class="p-5 border-t border-gray-100 flex items-center justify-between" style="display: none;">
            <p class="text-sm text-gray-500">
                Total <span id="totalCount" class="totalCount">0</span> , page  <span id="currentPage" class="currentPage">1</span> / <span id="totalPages" class="totalPages">1</span> Page
            </p>
            <div class="pagination-bar flex items-center">
                <!-- minPagebutton underscoreJavaScript DynamicShit.Generate -->
            </div>
        </div>
    </div>
</div>

<!-- DetailsBlast the window. -->
<div id="resultDetailModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
            <h3 class="modal-title">
                <i class="fa fa-list-alt" style="margin-right: 8px;"></i>
                Details of implementation results
            </h3>
            <button class="modal-close" id="closeDetailModal">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div class="modal-body" style="max-height: 500px; overflow-y: auto;">
            <div class="mb-4">
                <div class="flex items-center mb-2">
                    <label class="font-medium text-gray-600" style="width: 120px;">Data source table:</label>
                    <span id="detailSourceTable" class="text-gray-800">-</span>
                </div>
                <div class="flex items-center mb-2">
                    <label class="font-medium text-gray-600" style="width: 120px;">Target source table:</label>
                    <span id="detailTargetTable" class="text-gray-800">-</span>
                </div>
                <div class="flex items-center mb-2">
                    <label class="font-medium text-gray-600" style="width: 120px;">Other Organiser</label>
                    <span id="detailUpdateTime" class="text-gray-500">-</span>
                </div>
            </div>
            
            <div class="border-t pt-4">
                <h4 class="font-medium text-gray-700 mb-3">
                    <i class="fa fa-list" style="margin-right: 6px;"></i>
                    Field differences details
                </h4>
                <table class="table">
                    <thead>
                    <tr>
                        <th style="width: 150px;">Field name</th>
                        <th>Source Table Field Values</th>
                        <th>Target table field values</th>
                        <th>Explanation of variances</th>
                    </tr>
                    </thead>
                    <tbody id="detailContentTable">
                    <!-- DetailsThe content revisesJavaScript DynamicShit.Load -->
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button id="closeDetailModalBtn" class="btn btn-outline">
                <i class="fa fa-times"></i> Close
            </button>
        </div>
    </div>
</div>

<script th:src="@{/js/task/result.js}"></script>
<script th:inline="javascript">
    // FromURLParameterOther OrganisertaskId，andSettingsFor global variablesresult.jsUse

    
    $(document).ready(function() {
        const taskId = window.taskId;
        // Back to listbutton
        $('#backToListBtn').click(function() {
            doLoader('/task');
        });

        // Refreshbutton
        $('#refreshResultBtn').click(function() {
            if (window.resultPagination) {
                window.resultPagination.doSearch(window.resultPagination.searchParams || {taskId: window.taskId}, window.resultPagination.currentPage);
            }
        });

        // CloseDetailsBlast the window.
        $('#closeDetailModal, #closeDetailModalBtn').click(function() {
            $('#resultDetailModal').hide();
        });

        // Click outside the bullet windowClose
        $('#resultDetailModal').click(function(e) {
            if ($(e.target).is('#resultDetailModal')) {
                $(this).hide();
            }
        });
    });
</script>
</html>
