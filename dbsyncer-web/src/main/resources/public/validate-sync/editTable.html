<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <!-- AddTable GroupTableRegional-->
    <div class="grid grid-cols-9 items-center mt-4">
        <!-- Source tableSelector -->
        <div class="lg:col-span-4 form-item">
            <label class="form-label">Source table</label>
            <select id="source_table_select" class="form-control"></select>
        </div>

        <div class="text-info items-center text-center">
            <i class="fa fa-angle-double-right fa-2x"></i>
        </div>

        <!-- Target tableSelector -->
        <div class="lg:col-span-4 form-item">
            <label class="form-label">Target table</label>
            <select id="target_table_select" class="form-control"></select>
        </div>
    </div>

    <!-- Mark primary keyRegional-->
    <div class="grid grid-cols-9 items-center mt-4">
        <!-- SourcePrimary key -->
        <div class="lg:col-span-4 form-item">
            <label class="form-label">Mark primary key<i class="fa fa-question-circle" title="Source table/view has no primary key; define one or more"></i></label>
            <div class="form-control-area">
                <input id="sourceTablePK" class="form-control" type="text" data-role="tagsinput" placeholder="Please enter primary key"/>
            </div>
        </div>

        <div class="text-info items-center text-center"></div>

        <!-- TargetPrimary key -->
        <div class="lg:col-span-4 form-item">
            <label class="form-label">Mark primary key<i class="fa fa-question-circle" title="Target table/view has no primary key; define one or more"></i></label>
            <div class="form-control-area">
                <input id="targetTablePK" class="form-control" type="text" data-role="tagsinput" placeholder="Please enter primary key"/>
            </div>
        </div>
    </div>

    <!-- ActionsButton Area-->
    <div class="flex items-center justify-between mt-4">
        <div class="form-actions">
            <div id="searchTableGroup"></div>
        </div>

        <div class="form-actions">
            <button id="tableGroupAddBtn" type="button" class="btn btn-info">
                <i class="fa fa-plus"></i> Add
            </button>
            <button id="tableGroupDelBtn" type="button" class="btn btn-outline" disabled="disabled">
                <i class="fa fa-trash"></i> Delete
            </button>
            <button id="refreshTableBtn" type="button" class="btn btn-outline" th:title="Refresh source and target tables" onclick="bindTableRefresh()">
                <span class="fa fa-refresh"></span>Refresh tables
            </button>
        </div>
    </div>

    <!-- MapList -->
    <table class="table search-table-group-list hidden">
        <thead>
        <tr>
            <th></th>
            <th>
                Source table
            </th>
            <th>
                Target table
            </th>
            <th onclick="event.stopPropagation();">
                <input type="checkbox" class="tableGroupCheckboxAll" value="all" onclick="event.stopPropagation();" />
            </th>
        </tr>
        </thead>
        <tbody id="tableGroupList"></tbody>
    </table>
    <input id="sortedTableGroupIds" name="sortedTableGroupIds" type="hidden" />

<script th:inline="javascript">
    // MappingListminPage（ForAdd/DeleteBack LocalRefresh）
    var tableGroupPagination = null;

    /** OnlyRefreshMappingList，Do Not ReloadPage（Reservations not madeSaveYes.Name(for change of form)*/
    function refreshTableGroupList() {
        if (!tableGroupPagination) {
            return;
        }
        // After reload, DOM order follows the server; clear uncommitted drag order so save does not send a stale sequence
        $("#sortedTableGroupIds").val('');
        const taskId = $("#taskId").val();
        tableGroupPagination.doSearch({'id': taskId}, 1);
    }

    /**
     * Turn BackendminPageResultConvertDone.dbSelect VisibleData Structure。
     *
     * @param paging BackendminPageObject
     * @returns {Array<{label: string, value: string, disabled: boolean, data: {type: string}}>}
     */
    function convertPagingToSelectData(paging) {
        const rows = paging && Array.isArray(paging.data) ? paging.data : [];
        return rows.map(function(row) {
            const tableName = row && row.name ? row.name : '';
            const tableType = row && row.type ? row.type : 'TABLE';
            return {
                label: tableName + ' (' + tableType + ')',
                value: tableName,
                disabled: false,
                data: {type: tableType}
            };
        });
    }

    function syncTargetSelectionBySource(sourceNames, targetTableSelect) {
        if (!Array.isArray(sourceNames) || sourceNames.length === 0) {
            targetTableSelect.setValues([]);
            return;
        }
        doPoster("/validate-sync/searchTables", {
            id: $("#taskId").val(),
            type: 'target',
            pageNum: 1,
            pageSize: Math.max(50, sourceNames.length * 2),
            searchKey: '',
            tableNames: sourceNames.join('|'),
            exclude: 1
        }, function(res) {
            if (res.success !== true) {
                bootGrowl(res.message || "Failed to load target list", "danger");
                return;
            }
            const paging = res.data || {};
            const targetData = convertPagingToSelectData(paging);
            // Merge and Pressvalue Weight it up and avoid repeating it every time we trigger it.
            const mergedMap = {};
            (targetTableSelect.getData() || []).forEach(function(item) {
                if (item && item.value) {
                    mergedMap[item.value] = item;
                }
            });
            targetData.forEach(function(item) {
                if (item && item.value) {
                    mergedMap[item.value] = item;
                }
            });
            const mergedData = Object.keys(mergedMap).map(function(key) {
                return mergedMap[key];
            });

            targetTableSelect.setData(mergedData);

            const targetNameMap = {}; // key=UPPERCASE_NAME, value=real_value
            mergedData.forEach(function(item) {
                if (item && item.value) {
                    targetNameMap[String(item.value).toUpperCase()] = item.value;
                }
            });
            const matched = (sourceNames || []).map(function(name) {
                if (!name) {
                    return null;
                }
                return targetNameMap[String(name).toUpperCase()] || null;
            }).filter(function(name) {
                return !!name;
            });
            targetTableSelect.setValues(matched);
        });
    }

    /**
     * Draw Selector for Remote Bind TablesKeywordSearch + RollminPage）。
     *
     * @param selector Dropping Element
     * @param type source|target
     * @param onChange Organisation
     * @param excludeMode YesNoShow Mapexclude=1）
     * @returns {*}
     */
    function bindTableSelect(selector, type, onChange, excludeMode) {
        let currentExclude = excludeMode === '1' ? 1 : 0;
        let selectApi = null;
        selectApi = selector.dbSelect({
            type: 'multiple',
            remoteSearch: true,
            pageSize: 50,
            keywordDebounceMs: 300,
            loadOptions: function(query, onSuccess, onError) {
                doPoster("/validate-sync/searchTables", {
                    id: $("#taskId").val(),
                    type: type,
                    pageNum: query.pageNum,
                    pageSize: query.pageSize,
                    searchKey: query.searchKey || '',
                    exclude: currentExclude
                }, function (res) {
                    if (res.success === true) {
                        const paging = res.data || {};
                        const converted = convertPagingToSelectData(paging);
                        onSuccess({
                            pageNum: paging.pageNum || query.pageNum,
                            pageSize: paging.pageSize || query.pageSize,
                            total: paging.total || 0,
                            data: converted
                        });
                    } else {
                        bootGrowl(res.message || "Failed to load table list", "danger");
                        if (onError) {
                            onError();
                        }
                    }
                });
            },
            onSelect: function (data) {
                if (onChange) {
                    onChange(data);
                }
            },
            defaultValue: [],// Default Selection
            customButtons: [ // Up to 2 custom buttons
                {
                    text: 'Cancel Filter',
                    callback: function(values) {
                        currentExclude = 1;
                        selectApi.reloadRemote('');
                        bootGrowl("Coverage cancelled!", "success");
                    }
                }
            ]
        });
        return selectApi;
    }

    // TieRefreshDraw the watch.Event（OnlyRefreshLibraryWatch cache, drop-down remoteSearchWe'll get an update.NoneRequiredPageReload)
    function bindTableRefresh() {
        let id = $("#taskId").val();
        doPoster("/validate-sync/refreshTables", {'id': id}, function (data) {
            if (data.success === true) {
                bootGrowl("Refresh the watch!", "success");
            } else {
                bootGrowl(data.message, "danger");
            }
        });
    }

    // TieAddMap relationEvent
    function bindTableGroupAdd(sourceSelector, targetSelector){
        $("#tableGroupAddBtn").unbind("click").bind('click', function (e) {
            let sTables = sourceSelector.getValues();
            let sLen = sTables.length;
            if (sLen < 1) {
                bootGrowl("Select the data source table", "danger");
                return;
            }
            let tTables = targetSelector.getValues();
            let tLen = tTables.length;
            if (tLen < 1) {
                bootGrowl("Select the target source table", "danger");
                return;
            }
            if (sLen !== tLen) {
                bootGrowl("The number of map relationships is not consistent, please check the source and target table relationships", "danger");
                return;
            }
            let m = {};
            m.taskId = $("#taskId").val();
            m.sourceTable = sTables.join('|');
            m.targetTable = tTables.join('|');
            let sourceItems = sourceSelector.getSelectedItems();
            let targetItems = targetSelector.getSelectedItems();
            m.sourceType = sourceItems.length > 0 ? (sourceItems[0].data.type || 'TABLE') : 'TABLE';
            m.targetType = targetItems.length > 0 ? (targetItems[0].data.type || 'TABLE') : 'TABLE';
            m.sourceTablePK = $("#sourceTablePK").val();
            m.targetTablePK = $("#targetTablePK").val();
            const $btn = $(this);
            const originalText = $btn.html();
            $btn.html('<i class="fa fa-spinner fa-spin"></i>Add Appraisal...').prop('disabled', true);
            doPoster("/validate-sync/addTableGroup", m, function (data) {
                $btn.html(originalText).prop('disabled', false);
                if (data.success === true) {
                    bootGrowl("Add Map Relationship Success!", "success");
                    if (sourceSelector && typeof sourceSelector.setValues === 'function') {
                        sourceSelector.setValues([], true);
                    }
                    if (targetSelector && typeof targetSelector.setValues === 'function') {
                        targetSelector.setValues([], true);
                    }
                    refreshTableGroupList();
                } else {
                    bootGrowl(data.message, "danger");
                }
            });
        });
    }

    // TieDeleteTable ClickEvent
    function bindTableGroupRemove() {
        $("#tableGroupDelBtn").unbind("click").click(function () {
            const ids = [];
            $(".tableGroupCheckbox").each(function(){
                if($(this).prop('checked')){
                    ids.push($(this).val());
                }
            });
            if (ids.length > 0) {
                const taskId = $("#taskId").val();
                const $btn = $(this);
                const originalText = $btn.html();
                $btn.html('<i class="fa fa-spinner fa-spin"></i> Deleting...').prop('disabled', true);
                doPoster("/validate-sync/removeTableGroup", {
                    "taskId": taskId,
                    "ids": ids.join(",")
                }, function (response) {
                    $btn.html(originalText).prop('disabled', false);
                    if (response.success === true) {
                        bootGrowl("Remove map relationship succeeded!", "success");
                        refreshTableGroupList();
                    } else {
                        bootGrowl(response.message, "danger");
                    }
                });
            }
        });
    }

    // Multicheck or single-check binding check boxesEvent
    function bindTableGroupCheckbox() {
        const $checkboxAll = $('.tableGroupCheckboxAll');
        const $delBtn = $('#tableGroupDelBtn');
        let isUpdatingSelectAll = false;

        // Dynamically retrieve all single check boxes (research each call)
        function getCheckboxes() {
            return $('.tableGroupCheckbox');
        }

        // UpdateSelect AllCheckboxStatus
        function updateSelectAllState() {
            if (isUpdatingSelectAll) return;
            isUpdatingSelectAll = true;
            const $checkboxes = getCheckboxes();
            const $checkedCheckboxes = $checkboxes.filter(':checked');
            const allChecked = $checkboxes.length > 0 && $checkboxes.length === $checkedCheckboxes.length;
            const checkboxAllApi = $checkboxAll.data('checkboxGroup');
            if (checkboxAllApi) {
                checkboxAllApi.setValue(allChecked);
            } else {
                $checkboxAll.prop('checked', allChecked);
            }
            setTimeout(function() {
                isUpdatingSelectAll = false;
            }, 0);
        }

        // UpdateDeletebuttonStatus
        function updateDeleteButtonState() {
            const $checkboxes = getCheckboxes();
            $delBtn.prop('disabled', $checkboxes.filter(':checked').length === 0);
        }

        // Remove the old one first.EventTie (if any)
        $checkboxAll.off('change');
        getCheckboxes().off('change');

        // InitializeSelect AllCheckbox (if not initialized)
        if (!$checkboxAll.data('checkboxGroupInitialized')) {
            $checkboxAll.checkboxGroup({
                theme: 'danger',
                size: 'md',
                onChange: function(values) {
                    // Select All/CancelSelect All, sync all single check boxes
                    const isChecked = values.length > 0;
                    getCheckboxes().each(function() {
                        const api = $(this).data('checkboxGroup');
                        if (api) {
                            api.setValue(isChecked);
                        }
                    });
                    updateDeleteButtonState();
                }
            });
        }

        // Initialize all single check boxes
        getCheckboxes().each(function() {
            const $checkbox = $(this);
            if (!$checkbox.data('checkboxGroupInitialized')) {
                $checkbox.checkboxGroup({
                    theme: 'danger',
                    size: 'md',
                    onChange: function(values) {
                        updateSelectAllState();
                        updateDeleteButtonState();
                    }
                });
            }
        });
    }

    // Bind table-relation click handlers
    function bindMappingTableGroupListClick() {
        const $tableGroupList = $("#tableGroupList");

        // Check ElementYesNoExistence
        if (!$tableGroupList.length) {
            return;
        }

        $tableGroupList.unbind("click");
        $tableGroupList.find("tr").bind('click', function (e) {
            // If you clickYesCheck box or parent elementtd，Do not execute jump
            if ($(e.target).is('input[type="checkbox"]') || $(e.target).closest('td').find('input[type="checkbox"]').length > 0) {
                return;
            }
            doLoader('/validate-sync/page/editTableGroup?id=' + $(this).attr("id"));
        });

        // Use originalHTML5 DragAPI AlternativetableDnD
        const $rows = $tableGroupList.find("tr");
        $rows.each(function() {
            const $row = $(this);
            $row.attr('draggable', 'true');

            // Start Drag
            $row.on('dragstart', function(e) {
                e.originalEvent.dataTransfer.effectAllowed = 'move';
                e.originalEvent.dataTransfer.setData('text/html', this.innerHTML);
                $(this).addClass('dragging');
            });

            // Drag End
            $row.on('dragend', function(e) {
                $(this).removeClass('dragging');
                $rows.removeClass('drag-over');

                // Update Sorting Data
                var newData = [];
                $tableGroupList.find("tr").each(function () {
                    newData.push($(this).attr('id'));
                });
                $("#sortedTableGroupIds").val(newData.join('|'));
            });

            // Drag through.
            $row.on('dragover', function(e) {
                if (e.preventDefault) {
                    e.preventDefault();
                }
                e.originalEvent.dataTransfer.dropEffect = 'move';
                $(this).addClass('drag-over');
                return false;
            });

            // Drag away.
            $row.on('dragleave', function(e) {
                $(this).removeClass('drag-over');
            });

            // Placement
            $row.on('drop', function(e) {
                if (e.stopPropagation) {
                    e.stopPropagation();
                }

                var $dragging = $tableGroupList.find('.dragging');
                if ($dragging.length && $dragging[0] !== this) {
                    // Judge placement
                    var draggingIndex = $dragging.index();
                    var targetIndex = $(this).index();

                    if (draggingIndex < targetIndex) {
                        $(this).after($dragging);
                    } else {
                        $(this).before($dragging);
                    }
                }

                return false;
            });
        });
    }

    $(document).ready(function() {
        const excludeMode = new URLSearchParams(window.location.search).get('exclude');
        // Tie down the pull selectionEventAuto-match IllicitTableEvent：Source tableSyndication after checkoutTarget tableSame name
        let targetTableSelect = bindTableSelect($('#target_table_select'), 'target', null, excludeMode);
        let sourceTableSelect = bindTableSelect($('#source_table_select'), 'source', function() {
            syncTargetSelectionBySource(sourceTableSelect.getValues(), targetTableSelect);
        }, excludeMode);
        // Tie a lot.ValueInput BoxEvent
        initMultipleInputTags();
        // TieAddMap relationEvent
        bindTableGroupAdd(sourceTableSelect, targetTableSelect);
        // RenderSearchEnter box (create only once when data are available) and syncListVisibility
        let searchInited = false;
        function syncTableGroupListUi(pagination, taskId) {
            if (pagination.total > 0 && !searchInited) {
                $("#searchTableGroup").html(`<div class="search-wrapper">
                    <i class="fa fa-search search-icon"></i>
                    <input class="search-input" type="text" maxlength="32" placeholder="Search table name">
                    <span class="search-clear" title="Clear">
                        <i class="fa fa-times"></i>
                    </span>
                </div>`);
                initSearch('searchTableGroup', function (searchKey) {
                    pagination.doSearch({'searchKey': searchKey, 'id': taskId});
                });
                searchInited = true;
            }
            if (pagination.total <= 0) {
                $("#searchTableGroup").empty();
                searchInited = false;
            }
            $(".search-table-group-list").toggleClass("hidden", pagination.total <= 0);
            $('#tableGroupDelBtn').prop('disabled', true);
            $('.tableGroupCheckboxAll').prop('checked', false);
        }

        // InitializeminPageManager
        let taskId = $("#taskId").val();
        tableGroupPagination = new PaginationManager({
            requestUrl: '/validate-sync/searchTableGroup',
            params: {'id': taskId},
            tableBodySelector: '#tableGroupList',
            pageSize: 5,
            renderRow: function(t, index) {
                return `<tr id="${t.id}" title='Click to edit | Drag to reorder'>
                    <td>${index}</td>
                    <td>${t.sourceTable.name}</td>
                    <td>${t.targetTable.name}</td>
                    <td>
                        <input value="${t.id}" type="checkbox" class="tableGroupCheckbox" />
                    </td>
                </tr>`;
            },
            emptyHtml:'<td colspan="4" class="text-center"><p class="empty-text">No Map Relationship</p></td>',
            refreshCompleted: function() {
                syncTableGroupListUi(tableGroupPagination, taskId);
                // Bind table-relation click handlers
                bindMappingTableGroupListClick();
                // TieDeleteMap relationEvent
                bindTableGroupRemove();
                // Multicheck or single-check binding check boxesEvent
                bindTableGroupCheckbox();
            }
        });
    });
</script>
</div>

</html>
