<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Role management</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4" data-permission="user:edit">
            <button class="btn btn-primary" type="button" onclick="doLoader('/role/page/add')">
                <i class="fa fa-plus"></i> Add
            </button>
        </div>
        <p class="text-sm text-tertiary mb-4">They can build their own roles and assign functional competencies.</p>
        <table class="table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Permissions</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="roleList">
            <tr th:if="${roles == null or roles.isEmpty()}">
                <td colspan="3" class="text-center text-tertiary py-8">No role data available</td>
            </tr>
            <tr th:each="r : ${roles}">
                <td th:text="${r?.name}"></td>
                <td th:text="${r?.permissionCount}"></td>
                <td>
                    <div class="flex items-center">
                        <button class="table-action-btn view editRoleBtn" title="Configure Permissions"
                                th:data-id="${r?.id}">
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="table-action-btn delete removeRoleBtn" title="Delete"
                                th:data-id="${r?.id}"
                                th:data-name="${r?.name}"
                                data-permission="user:edit">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    $(function () {
        window.backIndexPage = function () {
            doLoader('/role');
        };

        $('.editRoleBtn').on('click', function () {
            doLoader('/role/page/edit?id=' + $(this).data('id'));
        });

        $('.removeRoleBtn').on('click', function () {
            const roleId = $(this).data('id');
            const name = $(this).data('name');
            const $btn = $(this);
            showConfirm({
                title: 'Other Organiser' + name + '」？',
                icon: 'warning',
                size: 'large',
                confirmType: 'danger',
                onConfirm: function () {
                    const originalText = $btn.html();
                    $btn.html('<i class="fa fa-spinner fa-spin"></i>').prop('disabled', true);
                    doPoster('/role/remove', {roleId: roleId}, function (data) {
                        $btn.html(originalText).prop('disabled', false);
                        if (data.success === true) {
                            bootGrowl('Deleted successfully!', 'success');
                            doLoader('/role?refresh=' + new Date().getTime());
                        } else {
                            bootGrowl(data.message || 'Delete failed', 'danger');
                        }
                    });
                }
            });
        });
    });
</script>
</html>
