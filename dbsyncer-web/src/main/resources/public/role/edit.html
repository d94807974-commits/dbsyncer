<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center"
            th:text="${createMode} ? 'Add Role ': 'configure Role Permissions ♪ I'm sorry ♪">Configure Role Permissions</h3>
    </div>
    <div class="card-body">
        <div class="form-actions mb-4">
            <button id="roleSubmitBtn" class="btn btn-primary" type="button" data-permission="user:edit">
                <i class="fa fa-save"></i> Save
            </button>
            <button class="btn btn-outline" type="button" onclick="backIndexPage()">
                <i class="fa fa-reply"></i> Back
            </button>
        </div>
        <form id="role-form-edit" method="post">
            <input type="hidden" name="roleId" th:value="${role?.id}"/>
            <div class="mb-4">
                <div class="form-item">
                    <label class="form-label">Name<strong class="text-primary">*</strong></label>
                    <div class="form-control-area">
                        <div class="w-320 max-w-full">
                            <input class="form-control" name="name" type="text" maxlength="64"
                                   required
                                   placeholder="Please enter a role name" th:value="${role?.name}"/>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="card-title mb-3">Functional Permissions</h4>
            <p class="text-sm text-tertiary mb-4">Check to save as soon as possible; menus are explicitly updated with new pages.</p>

            <table class="table" id="rolePermissionTable">
                <thead>
                <tr>
                    <th>Module</th>
                    <th>Permission Name</th>
                    <th>
                        <div class="flex items-center"
                             th:if="${permissionGroups != null and !permissionGroups.isEmpty()}">
                            <div class="checkbox-group checkbox-group-inline">
                                <input type="checkbox" id="rolePermSelectAll" class="rolePermSelectAll"/>
                                <label for="rolePermSelectAll">Select All</label>
                            </div>
                        </div>
                        <span th:if="${permissionGroups == null or permissionGroups.isEmpty()}">Authorization</span>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${permissionGroups == null or permissionGroups.isEmpty()}">
                    <td colspan="3" class="text-center text-tertiary py-8">No Permission Point</td>
                </tr>
                <th:block th:each="entry : ${permissionGroups}">
                    <tr th:each="p, stat : ${entry.value}">
                        <td th:if="${stat.first}" th:rowspan="${#lists.size(entry.value)}"
                            class="font-medium text-primary" th:text="${entry.key}"></td>
                        <td th:text="${p.name}"></td>
                        <td>
                            <div class="checkbox-group">
                                <input type="checkbox" name="permissionCode" class="rolePermissionCheckbox"
                                       th:id="'perm_' + ${p.code}"
                                       th:value="${p.code}"
                                       th:checked="${p.granted}"
                                       th:title="${p.name}"/>
                            </div>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </form>
    </div>
</div>

<script type="text/javascript" th:inline="javascript">
    $(function () {
        const createMode = [[${createMode == true}]];

        window.backIndexPage = function () {
            doLoader('/role');
        };

        const canEdit = !window.DBSPermission || DBSPermission.has('user:edit');
        const $checks = $('.rolePermissionCheckbox');
        $checks.prop('disabled', !canEdit);
        $('input[name="name"]').prop('readonly', !canEdit);
        $('#rolePermSelectAll').prop('disabled', !canEdit);
        $('#roleSubmitBtn').toggle(canEdit);

        $checks.checkboxGroup({
            theme: 'primary',
            size: 'md'
        });
        $('#rolePermSelectAll').checkboxGroup({
            theme: 'primary',
            size: 'md'
        });

        let syncingSelectAll = false;

        function paintCheckbox($el, checked) {
            $el.prop('checked', !!checked);
            const $item = $el.closest('.checkbox-group-item');
            if ($item.length) {
                $item.toggleClass('active', !!checked);
            }
        }

        function syncSelectAll() {
            if (syncingSelectAll) {
                return;
            }
            const $all = $checks.filter(':not(:disabled)');
            const checked = $all.length > 0 && $all.filter(':checked').length === $all.length;
            paintCheckbox($('#rolePermSelectAll'), checked);
        }

        $checks.on('change', syncSelectAll);
        syncSelectAll();

        $('#rolePermSelectAll').on('change', function () {
            if (!canEdit || syncingSelectAll) {
                return;
            }
            syncingSelectAll = true;
            const checked = $(this).is(':checked');
            $checks.each(function () {
                paintCheckbox($(this), checked);
            });
            syncingSelectAll = false;
        });

        $('#roleSubmitBtn').on('click', function () {
            if (!canEdit) {
                bootGrowl('No permission', 'danger');
                return;
            }
            const $form = $('#role-form-edit');
            if (!validateForm($form)) {
                return;
            }
            const codes = [];
            $form.find('.rolePermissionCheckbox:checked').each(function () {
                codes.push($(this).val());
            });
            const data = {
                roleId: $form.find('input[name="roleId"]').val(),
                name: $form.find('input[name="name"]').val(),
                permissionCodes: codes.join(',')
            };
            const url = createMode ? '/role/add' : '/role/edit';
            const $btn = $(this);
            const originalText = $btn.html();
            $btn.html('<i class="fa fa-spinner fa-spin"></i> Saving...').prop('disabled', true);
            doPoster(url, data, function (response) {
                $btn.html(originalText).prop('disabled', false);
                if (response.success !== true) {
                    bootGrowl(response.message || 'Save failed', 'danger');
                    return;
                }
                bootGrowl(createMode ? 'Add Success!' : 'Saved!', 'success');
                if (window.DBSPermission) {
                    refreshLoginUser();
                }
                backIndexPage();
            });
        });
    });
</script>
</html>
