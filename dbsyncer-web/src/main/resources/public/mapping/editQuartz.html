<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<div th:fragment="content">
    <!-- ScheduledSyncConfigTitle-->
    <p><i class="fa fa-clock-o text-success"></i> Time Configuration</p>

    <!-- First line:Insert、Update、Delete -->
    <div class="grid grid-cols-3">
        <!-- Insert -->
        <div class="form-item">
            <label class="form-label">Insert</label>
            <input name="timingInsert"
                   type="text"
                   class="form-control"
                   data-role="tagsinput"
                   placeholder="I"
                   th:value="${mapping?.listener?.insert}?:'I'" />
        </div>

        <!-- Update -->
        <div class="form-item">
            <label class="form-label">Update</label>
            <input name="timingUpdate"
                   type="text"
                   class="form-control"
                   data-role="tagsinput"
                   placeholder="U"
                   th:value="${mapping?.listener?.update}?:'U'"/>
        </div>

        <!-- Delete -->
        <div class="form-item">
            <label class="form-label">Delete</label>
            <input name="timingDelete"
                   type="text"
                   class="form-control"
                   data-role="tagsinput"
                   placeholder="D"
                   th:value="${mapping?.listener?.delete?:'D'}"/>
        </div>
    </div>

    <!-- I -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  -  - , -  -  -  -  -  -  -  -  -  - Cron、Event -->
    <div class="grid grid-cols-3 mt-4">
        <!-- Cron -->
        <div class="form-item">
            <label class="form-label">Cron<strong class="text-primary">*</strong></label>
            <input class="form-control" required name="timingCronExpression" th:value="${mapping?.listener?.cron}?:'*/30 * * * * ?'" type="text" placeholder="*/30 * * * * ?" />
        </div>

        <!-- Event -->
        <div class="form-item">
            <label class="form-label">Event<i class="fa fa-question-circle text-tertiary" title="Distinguishing between additions and deletions"></i></label>
            <select name="timingEventFieldName" class="form-control">
                <option value="" selected="selected">None</option>
                <option th:each="c,s:${mapping?.sourceColumn}"
                        th:value="${c?.name}"
                        th:text="${c?.name} +' (' + ${c?.typeName} +')'"
                        th:selected="${c.name eq mapping?.listener?.eventFieldName}"/>
            </select>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            initSelect($('select[name="timingEventFieldName"]'));
        });
    </script>

</div>

</html>
