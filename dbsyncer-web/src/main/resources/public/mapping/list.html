<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- QueryMappingList -->
<div class="form-container">
    <div class="card-header">
        <h3 class="card-title text-center">Data sync</h3>
    </div>
    <div class="card-body">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
                <div id="searchMapping" class="search-wrapper w-320 max-w-full flex-shrink-0">
                    <i class="fa fa-search search-icon"></i>
                    <input class="search-input" type="text" maxlength="32" placeholder="Search by name">
                    <span class="search-clear" title="Clear">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
                <div id="mappingGroupToolbar" class="flex items-center gap-2"></div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <span id="mappingGroupCreateHost" data-permission="mapping:edit"></span>
                <button id="mappingAddBtn" class="btn btn-primary" type="button" data-permission="mapping:edit">
                    <i class="fa fa-plus"></i> Add
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>Sync Scheme</th>
                <th>Type</th>
                <th>Result</th>
                <th>Status</th>
                <th>Last Sync</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="mappingTableBody"></tbody>
        </table>
        <div class="blank-block"></div>
    </div>
</div>

<script>
    function copyMapping(id) {
        doPoster("/mapping/copy", {id: id}, function (response) {
            if (response.success) {
                bootGrowl('Copied successfully', 'success');
                backIndexPage();
            } else {
                bootGrowl('Copy failed: ' + response.message, 'danger');
            }
        });
    }

    function changeMappingState(id, url, title) {
        const btn = event.target.closest('.table-action-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin" title="'+title+ '"></i>';
        btn.disabled = true;
        doPoster(url, {id: id}, function (response) {
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (response.success) {
                bootGrowl(title + 'Success', 'success');
                refreshIndexList();
            } else {
                // MappingCannot initialise Evolution's mail component.BizException（For example:Mapping cannot be empty）
                if (url === '/mapping/start' && response.message && response.message.indexOf('Mapping') !== -1) {
                    bootGrowl('The map relationship does not exist.', 'warning');
                    return;
                }
                bootGrowl(title + 'Failed: ' + response.message, 'danger');
            }
        })
    }

    function deleteMapping(id) {
        showConfirm({
            title: 'Are you sure you want to delete the driver?',
            icon: 'warning',
            size: 'large',
            confirmType: 'danger',
            onConfirm: function () {
                // Disablebutton to prevent repeat clicks
                doPoster('/mapping/remove', {id: id}, function (response) {
                    if (response.success === true) {
                        bootGrowl("Deleted successfully!", "success");
                        const rawStr = localStorage.getItem("dbsyncer.pagination.mapping-list");
                        const raw = JSON.parse(rawStr);
                        raw.pageNum = 1;
                        localStorage.setItem('dbsyncer.pagination.mapping-list', JSON.stringify(raw));
                        backIndexPage();
                    } else {
                        bootGrowl(response.message || "Delete failed", "danger");
                    }
                });
            }
        });
    }

    // StartButton Rendering: Hand over to the backend for verification (avoid error: statistics)TaskNotFinish total Maybe.0）
    function renderStateButtonWithMappingCheck(state, mapping) {
        return renderStateButton(state, mapping.id);
    }


    // PageInitialize
    $(document).ready(function () {
        // DefinitionsBackFunctions，SonPageNoodles.Back
        window.backIndexPage = function () {
            doLoader('/mapping/list');
        };
        let groupToolbar = null;
        // InitializeminPageManager
        const pagination = new PaginationManager({
            requestUrl: '/mapping/search',
            tableBodySelector: '#mappingTableBody',
            storageKey: 'mapping-list',
            pageSize: 5,
            params: {groupId: (window.GroupToolbar && GroupToolbar.peekStoredGroupId('mapping')) || ''},
            refreshCompleted: function () {
                if (groupToolbar) {
                    groupToolbar.setListTotal(pagination.total || 0);
                }
                if (window.DBSPermission) {
                    DBSPermission.apply('#mainContent');
                }
            },
            renderRow: function (mapping, index) {
                const source = mapping.sourceConnector || {};
                const target = mapping.targetConnector || {};
                const sourceName = source.name || 'Connector has been deleted';
                const targetName = target.name || 'Connector has been deleted';
                const sourceType = (source.config && source.config.connectorType) || '';
                const targetType = (target.config && target.config.connectorType) || '';
                const meta = mapping.meta || {};
                const canEdit = !window.DBSPermission || DBSPermission.has('mapping:edit');
                const editBtn = canEdit ? `
                            <button class="table-action-btn view" title="Edit" onclick="doLoader('/mapping/page/edit?id=${mapping.id}')">
                                <i class="fa fa-edit"></i>
                            </button>` : '';
                const copyBtn = canEdit ? `
                            <button class="table-action-btn copy" title="Copy" onclick="copyMapping('${mapping.id}')">
                                <i class="fa fa-copy"></i>
                            </button>` : '';
                return `
                <tr>
                    <td>${index}</td>
                    <td title="${escapeHtml(mapping.name)}">
                        <a href="javascript:void(0)" class="text-primary hover:underline cursor-pointer" title="Click to see details"
                           onclick="doLoader('/mapping/page/detail?id=${mapping.id}')">${escapeHtml(mapping.name)}</a>
                    </td>
                    <td title="${escapeHtml(sourceName)} > ${escapeHtml(targetName)}">
                        <div class="flex items-center">
                            <img draggable="false" class='mr-3' src="${$basePath}/img/${escapeHtml(sourceType)}.png" style="width: 40px; height: 40px;">
                            <span>${escapeHtml(sourceName)}</span>
                        </div>
                        <i class="fa fa-angle-double-down ml-3"></i>
                        <div class="flex items-center">
                            <img draggable="false" class='mr-3' src="${$basePath}/img/${escapeHtml(targetType)}.png" style="width: 40px; height: 40px;">
                            <span>${escapeHtml(targetName)}</span>
                        </div>
                    </td>
                    <td>${renderModelText(mapping.model)}</td>
                    <td class="sync-result-cell" style="min-width:140px;">${renderSyncResult(mapping)}</td>
                    <td>${renderStateText(meta.state || 0)}</td>
                    <td>${formatDate(meta.updateTime || '')}</td>
                    <td>
                        <div class="flex items-center">
                            ${editBtn}
                            ${renderStateButtonWithMappingCheck(meta.state || 0, mapping)}
                            ${copyBtn}
                        </div>
                    </td>
                </tr>
            `;
            },
            emptyHtml: '<td colspan="7" class="text-center"><i class="fa fa-exchange empty-icon"></i><p class="empty-text">Synchronising folder</p><p class="empty-description">Click Add button to create the first task</p></td>',
            customPageSize: true,
        });

        let searchInput = null;
        groupToolbar = GroupToolbar.initListToolbar({
            containerSelector: '#mappingGroupToolbar',
            createButtonHostSelector: '#mappingGroupCreateHost',
            resourceType: 'mapping',
            searchUrl: '/mapping/search',
            addPageUrl: '/mapping/pageAdd',
            addButtonSelector: '#mappingAddBtn',
            onChange: function () {
                pagination.doSearch(groupToolbar.getSearchParams({searchKey: searchInput ? searchInput.getValue() : ''}), 1);
            }
        });
        groupToolbar.setListTotal(pagination.total || 0);

        // SearchBox InputEvent
        searchInput = initSearch('searchMapping', function (searchKey) {
            pagination.doSearch(groupToolbar.getSearchParams({searchKey: searchKey}), 1);
        });

        // ListLocalRefresh（Start/StopWait.ActionsKeep Current AfterPageandminPageSize)
        window.refreshIndexList = function () {
            pagination.doSearch(groupToolbar.getSearchParams({searchKey: searchInput.getValue()}), pagination.currentPage);
        };

        // Register to GlobalScheduledRefreshManager
        PageRefreshManager.register(() => {
            pagination.doSearch(groupToolbar.getSearchParams({searchKey: searchInput.getValue()}), pagination.currentPage);
        });
    });
</script>

</html>
