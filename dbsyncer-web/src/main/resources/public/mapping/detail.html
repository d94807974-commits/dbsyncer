<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- Sync taskResultDetails（Map summary) -->
<div class="form-container" id="mappingDetailPage" th:attr="data-mapping-id=${mappingId}">
    <div class="card-header">
        <h3 class="card-title text-center">Sync Results Details</h3>
    </div>
    <div class="card-body">
        <div class="grid grid-cols-6 items-end mb-4">
            <div class="lg:col-span-2 form-item mb-0">
                <label class="form-label">Status</label>
                <select id="detailStatusFilter" class="form-control">
                    <option value="" th:selected="${detailStatus == null or detailStatus == ''}">All</option>
                    <option value="success" th:selected="${detailStatus == 'success'}">Success</option>
                    <option value="fail" th:selected="${detailStatus == 'fail'}">Failed</option>
                </select>
            </div>
            <div class="lg:col-span-4 flex items-center justify-end">
                <button type="button" class="btn btn-outline" onclick="backIndexPage()">
                    <i class="fa fa-reply"></i> Back to list
                </button>
            </div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th class="width50px"></th>
                <th>Source table</th>
                <th>Target table</th>
                <th>Successes</th>
                <th>Failures</th>
                <th>Updated At</th>
                <th class="width80px">View details</th>
            </tr>
            </thead>
            <tbody id="detail-result-table"></tbody>
        </table>
        <div class="blank-block"></div>
    </div>
</div>

<script th:src="@{/js/mapping/mapping-detail.js}"></script>
</html>
